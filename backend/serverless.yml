service: karuta-app

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-northeast-1
  environment:
    TABLE_NAME: ${self:custom.tableName}
    COMMENTS_TABLE_NAME: ${self:custom.commentsTableName}
    POLLY_CACHE_TABLE_NAME: ${self:custom.pollyCacheTableName} # 追加
    VOICE_AUDIO_BUCKET_NAME: ${self:custom.voiceAudioBucketName}-${aws:accountId} # 追加
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource:
            - !GetAtt KarutaTable.Arn
            - !GetAtt CommentsTable.Arn
            - !GetAtt PollyCacheTable.Arn # 追加
        - Effect: Allow
          Action:
            - polly:SynthesizeSpeech
          Resource: "*"
        - Effect: Allow # 追加（issue #382: 音声認識で回答を拾う機能）
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: !Sub "${VoiceAudioBucket.Arn}/*"
        - Effect: Allow # 追加（issue #382: 音声認識で回答を拾う機能。Transcribeはリソースレベル制限に対応しないため*を許可）
          Action:
            - transcribe:StartTranscriptionJob
            - transcribe:GetTranscriptionJob
          Resource: "*"

custom:
  tableName: karuta-phrases
  commentsTableName: karuta-comments
  pollyCacheTableName: karuta-polly-cache # 追加
  voiceAudioBucketName: karuta-voice-audio # 追加。バケット名はグローバルに一意である必要があるためアカウントIDを付与する
  allowedOrigins:
    - https://bamiyanapp.github.io
    - http://localhost:5173 # npm run dev（Vite開発サーバー）
    - http://localhost:4173 # npm run preview（Viteプレビューサーバー）

functions:
  getPhrase:
    handler: handler.getPhrase
    events:
      - http:
          path: get-phrase
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  getCategories:
    handler: handler.getCategories
    events:
      - http:
          path: get-categories
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  getCongratulationAudio:
    handler: handler.getCongratulationAudio
    events:
      - http:
          path: get-congratulation-audio
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  getPhrasesList:
    handler: handler.getPhrasesList
    events:
      - http:
          path: get-phrases-list
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  postComment:
    handler: handler.postComment
    events:
      - http:
          path: post-comment
          method: post
          cors:
            origins: ${self:custom.allowedOrigins}
  getComments:
    handler: handler.getComments
    events:
      - http:
          path: get-comments
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  recordTime:
    handler: handler.recordTime
    events:
      - http:
          path: record-time
          method: post
          cors:
            origins: ${self:custom.allowedOrigins}
  startSpeechRecognition: # 追加（issue #382: 音声認識で回答を拾う機能）
    handler: handler.startSpeechRecognition
    events:
      - http:
          path: start-speech-recognition
          method: post
          cors:
            origins: ${self:custom.allowedOrigins}
  getSpeechRecognitionResult: # 追加（issue #382: 音声認識で回答を拾う機能）
    handler: handler.getSpeechRecognitionResult
    events:
      - http:
          path: get-speech-recognition-result
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}

resources:
  Resources:
    KarutaTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        AttributeDefinitions:
          - AttributeName: category
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: category
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
    CommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.commentsTableName}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
    PollyCacheTable: # 追加
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.pollyCacheTableName}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        TimeToLiveSpecification: # キャッシュキーの組み合わせ分レコードが際限なく増加するのを防ぐため、一定期間後に自動削除する
          AttributeName: ttl
          Enabled: true
    VoiceAudioBucket: # 追加（issue #382: 音声認識で回答を拾う機能）
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.voiceAudioBucketName}-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration: # 録音・認識結果は判定後不要になるため、取り違え時の保持コスト・情報漏洩リスクを抑えるべく短期間で自動削除する
          Rules:
            - Id: ExpireVoiceRecognitionObjects
              Status: Enabled
              ExpirationInDays: 1
