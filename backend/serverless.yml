service: karuta-app

# 絵札PDF生成ワーカー（@sparticuz/chromium・puppeteer-core）はrenderEfudaPdfWorker
# でしか使わない重量級の依存（Chromiumバイナリ圧縮後約50-70MB）のため、全関数で1つの
# zipを共有するデフォルトのパッケージングのままだと、無関係な関数（getPhrase等）の
# コールドスタートまで悪化させてしまう。individually: trueで関数ごとに個別zipを作り、
# 下のpatternsで一旦全関数から重量級依存を除外したうえで、renderEfudaPdfWorker関数側の
# package.patternsで自分だけ再度含める（後段の定義が優先される.gitignore的な仕組み）
package:
  individually: true
  patterns:
    - "!node_modules/@sparticuz/**"
    - "!node_modules/puppeteer-core/**"

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-northeast-1
  environment:
    TABLE_NAME: ${self:custom.tableName}
    COMMENTS_TABLE_NAME: ${self:custom.commentsTableName}
    POLLY_CACHE_TABLE_NAME: ${self:custom.pollyCacheTableName} # 追加
    EFUDA_PDF_BUCKET_NAME: ${self:custom.efudaPdfBucketName}-${aws:accountId} # 追加（絵札PDFのサーバーサイド生成）
    QUIZ_ROOMS_TABLE_NAME: ${self:custom.quizRoomsTableName} # 追加（クイズ大会モード）
    QUIZ_ROOM_CONNECTIONS_TABLE_NAME: ${self:custom.quizRoomConnectionsTableName} # 追加（クイズ大会モード）
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource:
            - !GetAtt KarutaTable.Arn
            - !GetAtt CommentsTable.Arn
            - !GetAtt PollyCacheTable.Arn # 追加
        - Effect: Allow
          Action:
            - polly:SynthesizeSpeech
          Resource: "*"
        - Effect: Allow # 追加（絵札PDFのサーバーサイド生成: generateEfudaPdfからrenderEfudaPdfWorkerを非同期起動する）
          Action:
            - lambda:InvokeFunction
          Resource: !GetAtt RenderEfudaPdfWorkerLambdaFunction.Arn
        - Effect: Allow # 追加（絵札PDFのサーバーサイド生成: getEfudaPdfStatusが署名付きURLを発行するためGetObject/HeadObjectを要する）
          Action:
            - s3:GetObject
          Resource: !Sub "${EfudaPdfBucket.Arn}/*"
        - Effect: Allow # 追加（クイズ大会モード: ルーム・接続情報の読み書き、issue #489: トップページの一覧表示用にScanを追加）
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
          Resource:
            - !GetAtt QuizRoomsTable.Arn
        - Effect: Allow # 追加（クイズ大会モード: 接続情報の読み書き・ルーム単位の一覧取得。
          # UpdateItemは早押し機能issue #510のsetQuizRoomName（参加者名の保存）で使用）
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt QuizRoomConnectionsTable.Arn
            - !Sub "${QuizRoomConnectionsTable.Arn}/index/*"
        - Effect: Allow # 追加（クイズ大会モード: WebSocket接続への状態ブロードキャスト）
          # api-id/stageをワイルドカードにしているのはAWS公式ドキュメントで案内されている定型パターン。
          # Serverless Frameworkが自動生成するWebSocket APIの論理ID（未確定・デプロイ時に決まる）を
          # !Subで直接参照する方式は、名前を誤ると循環参照等でデプロイ自体が壊れるリスクがあるため
          # 採用しない（このAWSアカウントは本サービス専用でほかにWebSocket APIを持たない前提）
          Action:
            - execute-api:ManageConnections
          Resource: "arn:aws:execute-api:${aws:region}:${aws:accountId}:*/*/POST/@connections/*"

custom:
  tableName: karuta-phrases
  commentsTableName: karuta-comments
  pollyCacheTableName: karuta-polly-cache # 追加
  efudaPdfBucketName: karuta-efuda-pdf # 追加（絵札PDFのサーバーサイド生成）。バケット名はグローバルに一意である必要があるためアカウントIDを付与する
  quizRoomsTableName: karuta-quiz-rooms # 追加（クイズ大会モード）
  quizRoomConnectionsTableName: karuta-quiz-room-connections # 追加（クイズ大会モード）
  allowedOrigins:
    - https://bamiyanapp.github.io
    - http://localhost:5173 # npm run dev（Vite開発サーバー）
    - http://localhost:4173 # npm run preview（Viteプレビューサーバー）

functions:
  getPhrase:
    handler: handler.getPhrase
    events:
      - http:
          path: get-phrase
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  getCategories:
    handler: handler.getCategories
    events:
      - http:
          path: get-categories
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  getCongratulationAudio:
    handler: handler.getCongratulationAudio
    events:
      - http:
          path: get-congratulation-audio
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  getPhrasesList:
    handler: handler.getPhrasesList
    events:
      - http:
          path: get-phrases-list
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  postComment:
    handler: handler.postComment
    events:
      - http:
          path: post-comment
          method: post
          cors:
            origins: ${self:custom.allowedOrigins}
  getComments:
    handler: handler.getComments
    events:
      - http:
          path: get-comments
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  recordTime:
    handler: handler.recordTime
    events:
      - http:
          path: record-time
          method: post
          cors:
            origins: ${self:custom.allowedOrigins}
  generateEfudaPdf: # 追加（絵札PDFのサーバーサイド生成）。PDF生成ジョブを開始しjobIdを即返す
    handler: efudaPdfHandler.generateEfudaPdf
    environment:
      RENDER_WORKER_FUNCTION_NAME: !GetAtt RenderEfudaPdfWorkerLambdaFunction.Arn
    events:
      - http:
          path: generate-efuda-pdf
          method: post
          cors:
            origins: ${self:custom.allowedOrigins}
  renderEfudaPdfWorker: # 追加（絵札PDFのサーバーサイド生成）。generateEfudaPdfからの非同期Invokeでのみ呼ばれ、
    # API Gatewayには公開しない（httpイベントなし）。Chromium起動＋大量ページ描画は
    # API Gatewayの29秒タイムアウトを超えうるため、同期のHTTPルートでは完結させない
    handler: efudaPdfHandler.renderEfudaPdfWorker
    # 全関数共通の共有ロール(provider.iam.role)ではなく専用ロールを使う。共有ロールの
    # ポリシーがこの関数自身のArn（!GetAtt RenderEfudaPdfWorkerLambdaFunction.Arn、
    # generateEfudaPdfのlambda:InvokeFunction用）を参照しているため、この関数が
    # 共有ロールを使うと「ロール→自分自身の関数→ロール」という循環依存になり
    # CloudFormationのデプロイが失敗する（実際に発生した不具合）
    role: RenderEfudaPdfWorkerRole
    memorySize: 3008
    timeout: 300
    ephemeralStorageSize: 1024 # @sparticuz/chromiumが/tmpに展開する分の余裕を持たせる
    maximumRetryAttempts: 0 # 失敗時の自動リトライ（既定で最大2回）を無効化。S3のエラーマーカーとの状態不整合を防ぐ
    package:
      patterns:
        - "node_modules/@sparticuz/**"
        - "node_modules/puppeteer-core/**"
  getEfudaPdfStatus: # 追加（絵札PDFのサーバーサイド生成）。ジョブの完了をS3上のオブジェクトの有無から都度判定する
    handler: efudaPdfHandler.getEfudaPdfStatus
    events:
      - http:
          path: generate-efuda-pdf-status
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  createQuizRoom: # 追加（クイズ大会モード）。管理者用ルームを新規作成し、ルームIDと管理者トークンを返す
    handler: quizRoomHandler.createQuizRoom
    events:
      - http:
          path: quiz-room
          method: post
          cors:
            origins: ${self:custom.allowedOrigins}
  listQuizRooms: # 追加（クイズ大会モード、issue #489）。開設中のルーム一覧をトップページ表示用に返す
    handler: quizRoomHandler.listQuizRooms
    events:
      - http:
          path: quiz-rooms
          method: get
          cors:
            origins: ${self:custom.allowedOrigins}
  connectQuizRoom: # 追加（クイズ大会モード）。WebSocket接続時にroomId/adminTokenから役割を判定する
    handler: quizRoomHandler.connectQuizRoom
    events:
      - websocket:
          route: $connect
  disconnectQuizRoom: # 追加（クイズ大会モード）
    handler: quizRoomHandler.disconnectQuizRoom
    events:
      - websocket:
          route: $disconnect
  syncQuizRoom: # 追加（クイズ大会モード）。接続直後にクライアントから呼ばれ、現在の状態を1件返す
    handler: quizRoomHandler.syncQuizRoom
    events:
      - websocket:
          route: sync
  updateQuizRoomState: # 追加（クイズ大会モード）。管理者のみ状態を更新でき、ルーム内全接続へブロードキャストする
    handler: quizRoomHandler.updateQuizRoomState
    events:
      - websocket:
          route: updateState
  setQuizRoomName: # 追加（早押し機能、issue #510）。参加者が自分の表示名を接続情報へ保存する
    handler: quizRoomHandler.setQuizRoomName
    events:
      - websocket:
          route: setName
  buzzQuizRoom: # 追加（早押し機能、issue #510）。参加者の早押しを最初の1件だけ確定し、全接続へブロードキャストする
    handler: quizRoomHandler.buzzQuizRoom
    events:
      - websocket:
          route: buzz
  judgeQuizRoomBuzz: # 追加（早押し正誤判定、issue #546）。管理者のみ早押しの正誤を判定でき、正解なら加点、不正解なら他の参加者に早押しを再開させる
    handler: quizRoomHandler.judgeQuizRoomBuzz
    events:
      - websocket:
          route: judgeBuzz

resources:
  Resources:
    KarutaTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        AttributeDefinitions:
          - AttributeName: category
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: category
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
    CommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.commentsTableName}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
    PollyCacheTable: # 追加
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.pollyCacheTableName}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        TimeToLiveSpecification: # キャッシュキーの組み合わせ分レコードが際限なく増加するのを防ぐため、一定期間後に自動削除する
          AttributeName: ttl
          Enabled: true
    EfudaPdfBucket: # 追加（絵札PDFのサーバーサイド生成）
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.efudaPdfBucketName}-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration: # 生成済みPDF・エラーマーカーはダウンロード用の一時ファイルのため、短期間で自動削除する
          Rules:
            - Id: ExpireEfudaPdfObjects
              Status: Enabled
              ExpirationInDays: 1
    QuizRoomsTable: # 追加（クイズ大会モード）。roomId→管理者トークンのハッシュ・現在の状態を保持する
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.quizRoomsTableName}
        AttributeDefinitions:
          - AttributeName: roomId
            AttributeType: S
        KeySchema:
          - AttributeName: roomId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification: # 無人ルームが際限なく残らないよう、一定期間後に自動削除する
          AttributeName: ttl
          Enabled: true
    QuizRoomConnectionsTable: # 追加（クイズ大会モード）。connectionId→roomId・役割（admin/participant）を保持する
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.quizRoomConnectionsTableName}
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: roomId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes: # 状態更新時、ルーム内の全接続へブロードキャストするために必要
          - IndexName: roomId-index
            KeySchema:
              - AttributeName: roomId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification: # $disconnectが確実に呼ばれない異常切断時の保険として自動削除する
          AttributeName: ttl
          Enabled: true
    RenderEfudaPdfWorkerRole: # 追加（絵札PDFのサーバーサイド生成）。renderEfudaPdfWorker関数専用のロール
      # （provider.iam.roleの共有ロールを使うと、共有ロールのポリシーがこの関数自身のArnを
      # 参照する形になり循環依存でデプロイが失敗するため、専用ロールに分離している）
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: RenderEfudaPdfWorkerS3Access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:PutObject
                  Resource: !Sub "${EfudaPdfBucket.Arn}/*"
