name: Rollback to Stable (force_stable)
run-name: Rollback to Stable (manual)

# issue #1330（ブルーグリーンデプロイ導入 Task 11）: 管理者が問題を検知した際、
# 再デプロイ無しで即座に全トラフィックをstableへ戻す。CloudFront Functionsの
# KVS（force_stable）をtrueに設定する。
#
# 実行には、このリポジトリへの書き込み権限（workflow_dispatch実行権限）と
# AWS認証情報（Secrets、このworkflow内でのみ利用可能）が必要なため、
# 誰でも実行できるわけではない（issue #1330の受け入れ基準）。
#
# force_stableをfalse（通常運用）へ戻す操作は、本workflowの対象外とする。
# 誤ってtoggleしてしまう事故を避けるため、本workflowには「戻す」機能を
# 持たせない。復帰はTask 12（自動昇格、#1331）経由、または必要に応じて
# 別途手動でAWS CLIを実行する運用とする。
#
# issue #1548: force_stableをtrueに設定する処理自体が、後からdev-standards側で
# reusable-rollback-to-stable.ymlへ一般化された（bamiyanapp/dev-standards#756）。
# KVS ARNの解決方法（osls info）・反映確認（canary Cookie付きでの実アクセス確認）
# はプロダクト固有のためkaruta側に残し、KVS更新処理のみ共通actionへ委譲する
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  resolve:
    name: "CloudFrontドメイン・KVS ARNを解決する"
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.resolve.outputs.domain }}
      kvs_arn: ${{ steps.resolve.outputs.kvs_arn }}
    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Node.jsをセットアップする
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: infra依存パッケージをインストールする
        working-directory: infra
        run: npm ci

      - name: CloudFrontドメインとKVS ARNを解決する
        id: resolve
        working-directory: infra
        run: |
          set -eu
          INFO=$(npx osls info --config serverless.yml --stage shared --verbose 2>/dev/null)
          DOMAIN=$(echo "$INFO" | grep "FrontendDistributionDomainName" | sed -E 's/^[^:]*: *//')
          KVS_ARN=$(echo "$INFO" | grep "RoutingKeyValueStoreArn" | sed -E 's/^[^:]*: *//')
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "kvs_arn=${KVS_ARN}" >> "$GITHUB_OUTPUT"
          echo "Domain: ${DOMAIN}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  rollback:
    needs: resolve
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-rollback-to-stable.yml@v2.114.1
    with:
      kvs_arn: ${{ needs.resolve.outputs.kvs_arn }}
      kvs_key: force_stable
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  verify:
    name: "反映を確認する"
    needs: [resolve, rollback]
    runs-on: ubuntu-latest
    steps:
      # issue #1668: clear-force-stable.ymlと同根の問題。以前は"CANARY"/
      # "STABLE"（大文字）マーカー文字列の有無で判定していたが、アプリ側に
      # そのような出力は存在しない。明示prefix付き/canary/・/stable/
      # version.jsonと、prefixなし/version.json（Cookie経由で重み付け
      # ルーティングされる）を比較して判定する
      - name: 反映を確認する（KVS伝播待ち、既存canary Cookie保持者も含む）
        id: verify
        run: |
          set -eu
          DOMAIN="${{ needs.resolve.outputs.domain }}"

          CANARY_VERSION=$(curl -sS "https://${DOMAIN}/canary/version.json" --max-time 15 || echo "")
          STABLE_VERSION=$(curl -sS "https://${DOMAIN}/stable/version.json" --max-time 15 || echo "")
          echo "canary/version.json: ${CANARY_VERSION}"
          echo "stable/version.json: ${STABLE_VERSION}"

          if [ "$CANARY_VERSION" = "$STABLE_VERSION" ]; then
            echo "canary/stableが同一ビルド内容のため、version.jsonの内容比較では判定できない（誤判定防止のためスキップする）"
            echo "propagated=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # KVS更新のCloudFrontエッジ拠点への伝播は非同期（issue #1322の実機
          # 検証で最大30秒程度かかることを確認済み）。伝播を確認できるまで
          # 一定間隔でリトライする（最大120秒）
          MAX_WAIT_ATTEMPTS=12
          WAIT_SECONDS=10
          PROPAGATED=0
          for attempt in $(seq 1 "$MAX_WAIT_ATTEMPTS"); do
            CURRENT_VERSION=$(curl -sS "https://${DOMAIN}/version.json" --max-time 15 -b "canary=canary" || echo "")
            if [ "$CURRENT_VERSION" = "$STABLE_VERSION" ]; then
              PROPAGATED=1
              echo "反映を確認した（${attempt}回目、待機合計約$(( (attempt - 1) * WAIT_SECONDS ))秒）"
              break
            fi
            echo "${attempt}回目: まだ反映されていない（現在値: ${CURRENT_VERSION}）。${WAIT_SECONDS}秒待機して再試行する"
            sleep "$WAIT_SECONDS"
          done
          echo "propagated=${PROPAGATED}" >> "$GITHUB_OUTPUT"
          if [ "$PROPAGATED" -ne 1 ]; then
            echo "force_stable=trueが$((MAX_WAIT_ATTEMPTS * WAIT_SECONDS))秒経っても反映されなかった" >&2
            exit 1
          fi

      - name: 概要を出力する
        if: always()
        run: |
          set -eu
          RESULT="確認できなかった（要調査）"
          if [ "${{ steps.verify.outputs.propagated }}" = "1" ]; then
            RESULT="全アクセスがstableになることを確認した"
          elif [ "${{ steps.verify.outputs.propagated }}" = "2" ]; then
            RESULT="canary/stableが同一ビルド内容のため、version.json比較では判定不能だった（スキップ）"
          fi
          {
            echo "## issue #1330 管理者ロールバック実行結果"
            echo ""
            echo "force_stable: true に設定した"
            echo "反映確認: ${RESULT}"
            echo ""
            echo "通常運用への復帰（force_stableをfalseへ戻す）は、本workflowでは行わない。Task 12（自動昇格）経由、または別途手動対応が必要。"
          } >> "$GITHUB_STEP_SUMMARY"
