name: Backup DynamoDB Tables
run-name: Backup DynamoDB Tables (manual)

# issue #1320（ブルーグリーンデプロイ導入）のデータ層移管作業（Retain化→
# CloudFormationリソースインポート）は、手順を誤ると本番データを失うリスクが
# ある。移管作業の前に、いつでもこのワークフローを手動実行して全テーブルの
# オンデマンドバックアップを取得できるようにする（スマートフォンのGitHub
# Web/モバイルアプリのActionsタブから実行可能）。PITR（README.md「バックアップ
# と復旧」参照）は過去35日間の任意の時点への復旧用で常時有効だが、本ワークフローは
# 「このタイミングの状態を明示的に残す」ための追加の保険として使う。
#
# issue #1548: 本ワークフロー独自の実装ロジックが、後からdev-standards側で
# reusable-backup-dynamodb.ymlへ一般化された（bamiyanapp/dev-standards#726）。
# 独自複製を解消し、テーブル名リストを渡す薄いワークフローへ移行した。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-backup-dynamodb.yml@v2.101.0
    with:
      # テーブル名はbackend/serverless.ymlのcustom.*TableNameと一致させる。
      # テーブル追加・リネーム時はこの配列も更新すること
      table_names: >-
        ["karuta-phrases", "karuta-comments", "karuta-polly-cache",
        "karuta-quiz-rooms", "karuta-quiz-room-connections"]
      aws_region: ap-northeast-1 # backend/serverless.ymlのprovider.regionと統一する
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
