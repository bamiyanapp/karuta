name: Clear force_stable (resume normal routing)
run-name: Clear force_stable (manual)

# issue #1662: force_stableをfalse（通常運用、canary_weightによる分散
# ルーティング）へ戻す専用workflow。
#
# `rollback-to-stable.yml`はコメントで明記している通り、意図的に「戻す」機能を
# 持たない設計だった。しかし`reusable-promote-canary.yml`の自動昇格は
# force_stable=trueの間は判定自体を必ず弾くため、「復帰は自動昇格経由」という
# 想定は成立せず、force_stableが誤ってtrueのまま残ると、スマートフォンだけでは
# 復帰できない状態になっていた（dev-standards/docs/blue-green-stage-pattern.md
# 「自動昇格ワークフローの判定マトリクス」参照）。
#
# 誤operationへの抑制は、rollback-to-stable.ymlと対になる専用workflow（本
# workflow）として分離し、workflow_dispatch実行権限という既存の抑制に委ねる
# （bamiyanapp/dev-standards#948でreusable-rollback-to-stable.ymlへ追加された
# value inputを使う）
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  resolve:
    name: "CloudFrontドメイン・KVS ARNを解決する"
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.resolve.outputs.domain }}
      kvs_arn: ${{ steps.resolve.outputs.kvs_arn }}
    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Node.jsをセットアップする
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: infra依存パッケージをインストールする
        working-directory: infra
        run: npm ci

      - name: CloudFrontドメインとKVS ARNを解決する
        id: resolve
        working-directory: infra
        run: |
          set -eu
          INFO=$(npx osls info --config serverless.yml --stage shared --verbose 2>/dev/null)
          DOMAIN=$(echo "$INFO" | grep "FrontendDistributionDomainName" | sed -E 's/^[^:]*: *//')
          KVS_ARN=$(echo "$INFO" | grep "RoutingKeyValueStoreArn" | sed -E 's/^[^:]*: *//')
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "kvs_arn=${KVS_ARN}" >> "$GITHUB_OUTPUT"
          echo "Domain: ${DOMAIN}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  clear:
    needs: resolve
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-rollback-to-stable.yml@v2.114.1
    with:
      kvs_arn: ${{ needs.resolve.outputs.kvs_arn }}
      kvs_key: force_stable
      value: "false"
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  verify:
    name: "反映を確認する"
    needs: [resolve, clear]
    runs-on: ubuntu-latest
    steps:
      # issue #1668: 以前はレスポンス本文の"CANARY"/"STABLE"（大文字）マーカー
      # 文字列の有無で判定していたが、アプリ側にそのような出力は存在しない
      # （常に「見つからなかった」扱いになり判定が機能していなかった）。
      # infra/serverless.ymlのViewerRequestFunctionは、明示的な/stable/・
      # /canary/prefix付きアクセスを重み付け抽選のバイパスとして扱う。これを
      # 利用し、prefixなしの/version.jsonへCookie付きでアクセスした結果を、
      # 明示prefix付きで直接取得した2つのversion.jsonと比較することで、
      # 実際にどちらのバケット由来の内容が返っているかを判定する
      - name: 反映を確認する（KVS伝播待ち、canary Cookie保持者のルーティング確認）
        id: verify
        run: |
          set -eu
          DOMAIN="${{ needs.resolve.outputs.domain }}"

          CANARY_VERSION=$(curl -sS "https://${DOMAIN}/canary/version.json" --max-time 15 || echo "")
          STABLE_VERSION=$(curl -sS "https://${DOMAIN}/stable/version.json" --max-time 15 || echo "")
          echo "canary/version.json: ${CANARY_VERSION}"
          echo "stable/version.json: ${STABLE_VERSION}"

          if [ "$CANARY_VERSION" = "$STABLE_VERSION" ]; then
            echo "canary/stableが同一ビルド内容のため、version.jsonの内容比較では判定できない（誤判定防止のためスキップする）"
            echo "propagated=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # KVS更新のCloudFrontエッジ拠点への伝播は非同期（issue #1322の実機
          # 検証で最大30秒程度かかることを確認済み）。伝播を確認できるまで
          # 一定間隔でリトライする（最大120秒）。
          # canary Cookieを付けてアクセスし、canary側のversion.jsonと一致する
          # ことを確認する（force_stable=trueの間は常にstable側が返っていたため）
          MAX_WAIT_ATTEMPTS=12
          WAIT_SECONDS=10
          PROPAGATED=0
          for attempt in $(seq 1 "$MAX_WAIT_ATTEMPTS"); do
            CURRENT_VERSION=$(curl -sS "https://${DOMAIN}/version.json" --max-time 15 -b "canary=canary" || echo "")
            if [ "$CURRENT_VERSION" = "$CANARY_VERSION" ]; then
              PROPAGATED=1
              echo "反映を確認した（${attempt}回目、待機合計約$(( (attempt - 1) * WAIT_SECONDS ))秒）"
              break
            fi
            echo "${attempt}回目: まだ反映されていない（現在値: ${CURRENT_VERSION}）。${WAIT_SECONDS}秒待機して再試行する"
            sleep "$WAIT_SECONDS"
          done
          echo "propagated=${PROPAGATED}" >> "$GITHUB_OUTPUT"
          if [ "$PROPAGATED" -ne 1 ]; then
            echo "force_stable=falseが$((MAX_WAIT_ATTEMPTS * WAIT_SECONDS))秒経っても反映されなかった" >&2
            exit 1
          fi

      - name: 概要を出力する
        if: always()
        run: |
          set -eu
          RESULT="確認できなかった（要調査）"
          if [ "${{ steps.verify.outputs.propagated }}" = "1" ]; then
            RESULT="canary Cookie保持者がcanaryへルーティングされることを確認した（通常運用へ復帰）"
          elif [ "${{ steps.verify.outputs.propagated }}" = "2" ]; then
            RESULT="canary/stableが同一ビルド内容のため、version.json比較では判定不能だった（スキップ）"
          fi
          {
            echo "## issue #1662 force_stable解除実行結果"
            echo ""
            echo "force_stable: false に設定した"
            echo "反映確認: ${RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
