# 一時調査（dev-standards#1621）。Lambdaのnodejs26.xで、ESM専用パッケージ（jose 6）を、CommonJSからrequireできるかを確認する。
# nodejs22.x・nodejs24.xでは、環境変数なしだと、ERR_REQUIRE_ESMで失敗する（dev-standards docs/lambda-api-firebase-auth-pattern.md）。
# 使い捨ての関数とIAMロールを作り、実行して、必ず削除する。調査の完了後、このworkflowも削除する（check-tmp-workflows）。
#
# 注意: OIDCのロールは、mainブランチからだけ引き受けられる（infra/github-oidc/karuta-deploy-role.yml）。
# このworkflow自体の変更時に、mainへのpushで自動で動く。手動でも実行できる
name: tmp-lambda-node26-probe
run-name: tmp-lambda-node26-probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tmp-lambda-node26-probe.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: tmp-lambda-node26-probe
  cancel-in-progress: false

jobs:
  probe:
    name: "使い捨てのLambda関数で、ESM専用パッケージのrequireを確認する"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREFIX: tmp-karuta-node26-probe-${{ github.run_id }}
      AWS_REGION: ap-northeast-1
    steps:
      - name: OIDCでAWSの一時クレデンシャルを取得する
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: 関数のコードを作る（jose 6はESM専用）
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fn" && cd "$RUNNER_TEMP/fn"
          npm init -y >/dev/null
          npm install jose@6 --no-audit --no-fund >/dev/null
          cat > index.js <<'JS'
          exports.handler = async () => {
            try {
              const jose = require("jose");
              return { ok: true, node: process.version, hasJwtVerify: typeof jose.jwtVerify };
            } catch (e) {
              return { ok: false, node: process.version, code: e.code, message: String(e.message).slice(0, 200) };
            }
          };
          JS
          zip -qr "$RUNNER_TEMP/fn.zip" .

      - name: 使い捨てのロールと関数を作り、実行し、削除する
        run: |
          set -u
          fail=0
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          cleanup() {
            for n in n26-plain n26-env n24-plain; do
              aws lambda delete-function --function-name "$PREFIX-$n" >/dev/null 2>&1 || true
            done
            aws iam delete-role --role-name "$PREFIX" >/dev/null 2>&1 || true
            # 削除の確認。残っていれば、ジョブを失敗させる
            left=0
            for n in n26-plain n26-env n24-plain; do
              if aws lambda get-function --function-name "$PREFIX-$n" >/dev/null 2>&1; then left=1; echo "::error::関数が残っています: $PREFIX-$n"; fi
            done
            if aws iam get-role --role-name "$PREFIX" >/dev/null 2>&1; then left=1; echo "::error::ロールが残っています: $PREFIX"; fi
            # 残っていれば、終了コードを失敗にする（EXITのtrapからのexitは、終了コードを上書きする）
            if [ "$left" = 1 ]; then exit 1; fi
          }
          trap cleanup EXIT

          summary "## nodejs26.x のESM専用パッケージのrequire（dev-standards#1621）"
          # 権限の無い、使い捨てのロール（Lambdaが引き受けるだけ）
          aws iam create-role --role-name "$PREFIX" \
            --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}' >/dev/null
          ROLE_ARN=$(aws iam get-role --role-name "$PREFIX" --query Role.Arn --output text)
          sleep 15  # IAMの反映待ち

          create() { # 名前 ランタイム [環境変数]
            if [ -n "${3:-}" ]; then
              aws lambda create-function --function-name "$PREFIX-$1" --runtime "$2" --handler index.handler \
                --role "$ROLE_ARN" --zip-file "fileb://$RUNNER_TEMP/fn.zip" --timeout 10 \
                --environment "Variables={NODE_OPTIONS=$3}" >/dev/null
            else
              aws lambda create-function --function-name "$PREFIX-$1" --runtime "$2" --handler index.handler \
                --role "$ROLE_ARN" --zip-file "fileb://$RUNNER_TEMP/fn.zip" --timeout 10 >/dev/null
            fi
          }
          run_one() { # 名前 ランタイム 説明 [環境変数]
            if ! create "$1" "$2" "${4:-}" 2>"$RUNNER_TEMP/err.txt"; then
              summary "- $3: 関数を作れませんでした（$(tr '\n' ' ' < "$RUNNER_TEMP/err.txt" | cut -c1-200)）"; fail=1; return
            fi
            aws lambda wait function-active-v2 --function-name "$PREFIX-$1"
            aws lambda invoke --function-name "$PREFIX-$1" "$RUNNER_TEMP/out-$1.json" >"$RUNNER_TEMP/inv-$1.json"
            fe=$(grep -o '"FunctionError": *"[^"]*"' "$RUNNER_TEMP/inv-$1.json" || true)
            summary "- $3: ${fe:-FunctionErrorなし} / 応答: $(cut -c1-300 "$RUNNER_TEMP/out-$1.json")"
          }

          run_one n24-plain nodejs24.x "nodejs24.x・環境変数なし（比較用。dev-standardsの実測では、ERR_REQUIRE_ESM）"
          run_one n26-plain nodejs26.x "nodejs26.x・環境変数なし"
          run_one n26-env   nodejs26.x "nodejs26.x・NODE_OPTIONS=--experimental-require-module" "--experimental-require-module"
          exit "$fail"
