name: CI
run-name: >-
  CI (${{ github.event_name == 'pull_request' && 'PR' || github.event_name == 'push' && 'push-to-main' || github.event_name == 'schedule' && 'scheduled' || 'manual' }})
  ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}

# issue #1809: 似た目的・近い実行タイミングの薄いワークフローファイルが
# 増えすぎてActionsタブの実行一覧が見にくくなっていたため、1ファイルへ統合した
# （元: codeql.yml・dependency-deprecation-scan.yml・dependency-full-scan.yml）。
# 各jobは起動イベント・schedule種別に応じてif:条件で選択的に実行する

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # CodeQL: コード変更が無い期間もクエリセット自体の更新を検知する
    - cron: "0 15 * * 1" # 依存deprecatedスキャン: 毎週月曜0:00 JST（UTC 15:00、日曜）
    # 依存フル脆弱性スキャン: issue #1842、検知ラグ短縮のため週次から日次へ変更した。
    # 上記2つの週次スキャンと同時刻にならないよう30分ずらす
    - cron: "30 15 * * *"
  workflow_dispatch: {} # CodeQL・依存スキャン系jobの手動実行用（ciジョブは対象外）

permissions:
  contents: write
  issues: write
  pull-requests: write
  # SARIFをGitHub Securityタブへアップロードするためにreusable-codeql.yml側が要求する権限。
  # 呼び出し元（このワークフロー）で明示しない場合、リポジトリ既定のGITHUB_TOKEN権限
  # （securityevents:writeを含まない）が上限になりアップロードが失敗するため必須
  security-events: write
  actions: read

jobs:
  ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    # v2.104.1→v2.105.1: dev-standards issue #1111（PR #1112）でOSV API
    # querybatchの1リクエストあたり件数上限（400 Bad Request）に対応する
    # チャンク分割が入った。dependency-full-scan jobの修正を取り込むために
    # 本workflowの全job参照を合わせて更新する
    # v2.105.4→v2.105.5: dev-standards issue #1071の修正（PR #1124）で、
    # reusable-ci.ymlの自己参照チェックアウトが新規必須入力self_ref経由の
    # 値を使う方式に変わった。呼び出し元（本workflow）が、下記uses:行の
    # refと同じ値をself_refとして渡す必要がある
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.105.6
    with:
      self_ref: v2.105.6
      frontend_dir: frontend
      backend_dir: backend
      node_version: "22" # backend Lambdaランタイムnodejs22.x（issue #609）・CD（issue #610）と統一する
      enable_e2e_test: true
      enable_standards_check: true
      workspaces: true # npm workspaces構成（issue #608）。依存インストールをリポジトリルートで一括実行する
      # frontend/backendいずれか一方のみの変更時、対象外パッケージのfrontend-test・
      # backend-test・frontend-e2e-test・duplication-check・architecture-checkを
      # スキップし、CI実行時間・GitHub Actions利用時間を削減する（issue #1188）
      enable_path_filtering: true
      # SonarCloud相当の静的解析（issue #806）のうち、コード重複検知（jscpd）を有効化する。
      # 導入直後はduplication_threshold未指定（レポート表示のみ、ゲートなし）としていたが、
      # 検出しても何も強制されない状態が放置されていたため、現状の重複率（行ベース）を
      # ベースラインとしたラチェット方式でゲートを有効化する。issue #833でQuizRoomView等
      # の重複解消を進め、20.31%→18.64%まで削減できた。その後dev-standards側でjscpdの
      # 対象からテストファイル（*.test.*・*.spec.*・e2eディレクトリ配下）を除外する対応
      # （bamiyanapp/dev-standards#132、v1.12.5で反映）が入り、除外前は主にテストファイル
      # だった重複がスキャン対象から外れたため、プロダクトコードのみの実測値（0.46%、
      # backend/backfill-*.jsのバックフィルスクリプト間の重複のみ）に合わせて
      # しきい値をさらに引き下げた（issue #877）
      enable_duplication_check: true
      # issue #1693のフォローアップ（PR #1698）: dependency-deprecation-scan.ymlの
      # 不具合修正に伴いdev-standards submoduleのポインタを更新したところ、
      # dev-standards自身のscripts/配下（dependency-deprecation-info.js・
      # dependency-deprecation-scan.js・dependency-maintainer-info.js等、意図的に
      # 同じ構成で実装されている）の相互重複が初めてスキャン対象に含まれ、
      # 1%を僅かに超えた（1.12%）。これはkaruta自身のプロダクトコードの重複では
      # なくdev-standards側の既知の内部重複（dev-standards自身のCIはこの重複に
      # 閾値を設けていない）であり、submodule参照を更新する限り常に再発し得る。
      # 本来はduplication-check側でdev-standards/scripts/等shared/以外を除外すべき
      # （bamiyanapp/dev-standards#621の意図はshared/のみが対象）だが、karuta側は
      # reusable-ci.ymlをv2.80.0に固定しているため、直ちにそちらを修正しても反映
      # されない。暫定的に閾値を緩め、恒久対応はフォローアップissueで追う
      duplication_threshold: 2
      # 独自実装したworkflow・composite actionが、後からdev-standards側で
      # reusable workflow・composite actionへ一般化されたのに追従せず、
      # 同じロジックが両方に残ったまま放置される事故を検知する
      # （bamiyanapp/dev-standards#874、karuta issue #1548で実際に発覚）。
      # 導入直後のため、実測値に基づくラチェット閾値はまだ設定せず
      # レポート表示のみとする（duplication_thresholdと同様の方針）
      enable_workflow_duplication_check: true
      # frontend/backend間の越境import・循環依存を検知するdependency-cruiserを
      # 有効化する（bamiyanapp/dev-standards#523、issue #1216）。事前検証で
      # karutaの既存コードに違反が無いことを確認済み
      enable_architecture_check: true
      # 分岐(branches)カバレッジ80%必須化（issue #459）のうち、branches指標のみ
      # 引き続き見送る。backend側で、複数のテストファイルが同一のソースファイル
      # （例: backend/handler.js）をimportする構成において、@vitest/coverage-v8の
      # カバレッジ集計（特にbranches指標）がCI実行のたびに不安定になる
      # （ローカルでは実行のたびに50%台〜86%台まで結果が揺れ、CI上でも同様に
      # 不安定）ことを確認済み。一方でstatements/functions/linesの3指標は
      # 全体平均で複数回にわたり安定して80%以上を計測できたため、この3指標に
      # 限定してゲートを有効化する（branchesは表には引き続き表示されるが、
      # 判定対象からは除外する）。ファイル単位判定（coverage_check_per_file）は、
      # handler.js単体で見てもこの3指標が不安定に80%を割り込むことがあったため
      # 有効化を見送る（issue #459は完了とせず、この残課題を明記してオープンの
      # ままにする）
      coverage_threshold: 80
      coverage_metrics: "statements,functions,lines"
      # E2Eテスト（Playwright）のJSカバレッジ閾値（issue #576）。dev-standards v1.13.0で
      # e2e_coverage_threshold/e2e_coverage_metricsが導入され、E2Eカバレッジも
      # check-coverage-thresholdでゲート可能になった。理想値の80%にはまだ届いていないため、
      # PR #883/#884で追加したテスト（読み上げ履歴パネルの開閉、ルームを閉じる確認ダイアログの
      # キャンセル分岐、招待URLコピー）マージ後の実測値（statements 74.71%、functions 68.19%、
      # lines 68.32%、branches 61.98%）をベースラインとしたラチェット方式で閾値を設定し、
      # 将来の実装追加でカバレッジが悪化した場合に検知できるようにする。branchesはbackendの
      # coverage_metricsと同じ理由（@vitest/coverage-v8のbranches指標がCI実行のたびに
      # 変動し不安定）で判定対象から除外する。閾値はstatements/functions/linesの実測値のうち
      # 最小のfunctions/lines（68%台）を基準に、実行毎の変動を吸収する余裕を持たせて65とした。
      # efudaPDFの実際の生成・エラー報告の実際の送信はE2Eで検証しない方針のため、実測値と
      # 理想の80%とのギャップは許容された既知の技術的負債として残し、issue #576はこの
      # ラチェット導入をもって一旦クローズする
      e2e_coverage_threshold: 65
      e2e_coverage_metrics: "statements,functions,lines"
      # issue #824: docs/cicd-pipeline-specification.mdおよびREADME.md（System
      # Architecture／Screen Transitionsの2図）のmermaid図をSVGへ事前レンダリング
      # し、PR差分ビュー・API経由でのファイル取得等でmermaidがネイティブ
      # レンダリングされない場面でも確認できるようにする
      # docs/generated/配下の4ファイル（websocket-api.md・dynamodb-tables.md・
      # serverless-architecture.md・cicd-architecture.md）は、issue #901-909の
      # ドキュメント自動生成でMermaid図を追加したが、mermaid_doc_pathsに含めて
      # いなかったためコードのままでしか見えず画像化されていなかった。対象に追加する
      # dev-standards#942（issue #1562前段）: Lighthouse CIによるパフォーマンス・
      # アクセシビリティ・SEOスコアの継続監視を有効化する。計測対象URL・
      # 退行検知の閾値はfrontend/lighthouserc.jsonに委ねる
      enable_lighthouse_ci: true
      # karuta#1762: lighthouserc.jsonのassertionsを"error"レベルに設定した上で、
      # 閾値を下回った場合にmergeをブロックする（dev-standards#1063/#1064）。
      # CI実行環境でのPerformanceスコア実測値が0.59前後だったため、既存PRを
      # 即座に全てブロックしないよう60点から開始した。karuta#1766（ヘッダー
      # アイコンのWebP化・preload追加）でPerformanceスコアが0.71→0.75へ改善
      # したことを確認し70点へ引き上げたが、同一コード・連続実行でも
      # Performanceスコアが0.68〜0.75の範囲でブレることが判明し（境界線上で
      # フレーキーに失敗）、70点はまだ早かった。ブレを吸収できる安全マージンを
      # 残すため65点へ引き下げた。issue #1848: さらに0.63（既知のブレ範囲
      # 0.68〜0.75よりも低い）での失敗が実際に発生し、workflow定義ファイルのみの
      # 無関係な変更のPR（#1845）をブロックした。頻発する失敗を抑えるため60点へ
      # 再度引き下げた。以降も実測値の安定度を見ながら段階的に引き上げる方針とする
      enable_lighthouse_ci_gating: true
      enable_mermaid_render: true
      mermaid_doc_paths: "docs/cicd-pipeline-specification.md\nREADME.md\ndocs/generated/websocket-api.md\ndocs/generated/dynamodb-tables.md\ndocs/generated/serverless-architecture.md\ndocs/generated/cicd-architecture.md\ndocs/quiz-room-operations.md"
      # dev-standards#436・#447: Markdownドキュメントの日本語文章に対する
      # textlintチェックを有効化する（issue #1179）
      enable_text_lint: true
      text_lint_paths: "docs/*.md\nREADME.md\nCLAUDE.md\n.claude/skills/**/*.md"
      # Markdownドキュメント間の相対リンクが実在するファイルを指しているかを
      # 検証する（bamiyanapp/dev-standards#603）。一部のSKILL.mdがdev-standards
      # 自身のdocs/への相対リンクを含み、symlink経由で取り込まれた際にリンク切れ
      # になる問題（bamiyanapp/dev-standards#880）はdev-standards側で修正済み
      # （絶対URL化、PR #883）のため、.claude/skills/配下も対象に含める
      enable_dead_link_check: true
      dead_link_check_paths: "docs/*.md\nREADME.md\nCLAUDE.md\n.claude/skills/**/*.md"
      # Markdownドキュメント間の丸ごとコピペ重複を検知する
      # （bamiyanapp/dev-standards#586）。duplication_thresholdと同様、
      # 導入直後のためレポート表示のみとする
      # docs/配下にベンダーアイコン等の非Markdownアセット（docs/resources/）が
      # あるため、ディレクトリ指定ではなく拡張子で絞り込む
      enable_doc_duplication_check: true
      doc_duplication_paths: "docs/*.md\nREADME.md\nCLAUDE.md\n.claude/skills/**/*.md"
      # README.md・CLAUDE.mdから辿れない「孤立ドキュメント」を検知する
      # （bamiyanapp/dev-standards#848）
      # .claude/skills/配下は対象外とする。CLAUDE.md「Skills」節はSKILL.mdへの
      # 個別リンクではなく箇条書きで列挙する運用のため、リンク到達性の判定に
      # 合わない（dev-standards自身のci.ymlもdocs/**/*.mdのみを対象にしている）
      enable_doc_reachability_check: true
      doc_reachability_entry_points: "README.md\nCLAUDE.md"
      doc_reachability_paths: "docs/*.md"
      # push時CI軽量化（issue #973、dev-standards#187バックログ③）。PRの
      # 「base_branchと同期済みでなければマージ不可」（up-to-date required）
      # ＋Squash merge運用のもとでは、squash merge直後のpush-to-main上のツリーは
      # 直前のpull_requestイベントで検証済みのPR head内容と完全に一致するため、
      # push時のfrontend-test/backend-test/package-test/standards-check/
      # duplication-checkの再実行は構造的に冗長。frontend-e2e-test（E2E
      # スクリーンショットのlatest/ベースライン公開）・render-mermaid-diagrams
      # （mermaid画像のlatest/公開）はpush時のみの副作用があるため対象外のまま
      # スキップされない（reusable-ci.yml側の実装）
      skip_verification_on_push: true
      # package-lock.json変更時にupdate type・CVE/KEV・Supply Chainチェック・業務影響度
      # （ブラスト半径、dependency-risk-critical-paths.json）等をまとめたRisk Summaryを
      # PRへ投稿する（dev-standards#645、issue #1312/#1313）。本機能を使うには
      # dependency-risk-critical-paths.json（本リポジトリルート）を参照し、重要パス該当時に
      # 適用リスクを1段階昇格する。詳細はdev-standards/docs/dependency-risk-judgment.mdを参照
      enable_dependency_risk_summary: true
      # 適用リスクがHighのPRでは自動マージを止める（dev-standards#647 Phase 2、issue #1313）。
      # Renovate等が作成した依存更新PRのうち、重要パスに影響するもの・既知のCVE/KEV・
      # Supply Chain異常等でHighと判定されたものは、人間のレビューを経るまで自動マージされない
      enable_dependency_risk_gating: true
      # 適用リスクHigh・維持リスクLow（放置する方が安全）のbot作成PRを自動コメント・
      # クローズする（dev-standards#746 Phase 1、issue #1459）。PR #1458で本来クローズ
      # されるべきPRが残っていたのは、本フラグ自体が未設定だったため
      enable_dependency_risk_auto_close: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  codeql:
    name: CodeQL
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1') || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-codeql.yml@v2.105.6

  dependency-deprecation-scan:
    name: 依存deprecatedスキャン
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 15 * * 1')
    permissions:
      contents: read
      issues: write
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-dependency-deprecation-scan.yml@v2.105.6
    with:
      lockfile_path: package-lock.json
      direct_only: true

  dependency-full-scan:
    name: 依存フル脆弱性スキャン
    # issue発覚の直接の契機: OSV API querybatchの件数上限（400 Bad Request、
    # dev-standards issue #1111）で本jobが失敗していた。v2.105.1で修正済み
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '30 15 * * *')
    permissions:
      contents: read
      issues: write
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-dependency-full-scan.yml@v2.105.6
    with:
      lockfile_path: package-lock.json
