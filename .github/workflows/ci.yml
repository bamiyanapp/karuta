name: CI
run-name: >-
  CI (${{ github.event_name == 'pull_request' && 'PR' || 'push-to-main' }})
  ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v1.6.3
    with:
      frontend_dir: frontend
      backend_dir: backend
      node_version: "22" # backend Lambdaランタイムnodejs22.x（issue #609）・CD（issue #610）と統一する
      enable_e2e_test: true
      enable_standards_check: true
      workspaces: true # npm workspaces構成（issue #608）。依存インストールをリポジトリルートで一括実行する
      # 分岐(branches)カバレッジを基準に80%を必須化し、ファイル単位でも80%を必須化する（issue #459）
      coverage_threshold: 80
      coverage_metrics: "branches"
      coverage_check_per_file: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
