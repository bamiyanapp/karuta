name: CI
run-name: CI ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@main
    with:
      frontend_dir: frontend
      backend_dir: backend
      base_branch: main
      release_branch: release
      sync_branch_prefix: sync/release-to-main
      merge_ours_paths: frontend/src/changelog.json
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
