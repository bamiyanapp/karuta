name: Deploy Backend Stage
run-name: Deploy Backend Stage (manual, ${{ inputs.stage }})

# issue #1323（ブルーグリーンデプロイ導入 Task 4）: backend/serverless.ymlは
# すでにstageに依存しない構成になっている（DynamoDBテーブル等のステートフル
# リソースはissue #1320でserverless-data.ymlへ分離済み、IAMポリシー・環境変数の
# テーブル名も固定文字列でstageを含まない）。そのため`osls deploy --stage
# <任意の名前>`はコード変更無しでそのまま独立したCloudFormationスタック
# （Serverless Frameworkの既定命名規則`${service}-${stage}`、例:
# karuta-app-stable・karuta-app-canary）としてデプロイできる。
#
# 本ワークフローはstable/canaryそれぞれへの手動デプロイ用。CDパイプラインへの
# 統合（mainマージ時にcanaryへ自動デプロイする等）はTask 6（#1325）の範囲。
#
# 現行の本番は明示的なstage指定が無いままデプロイされており、Serverless
# Frameworkの既定値であるstage「dev」として稼働している
# （docs/blue-green-stage-migration.md参照）。本ワークフローで新たにstable/
# canaryへデプロイしても、既存のdevスタックには一切影響しない
# （デプロイ単位が完全に独立したCloudFormationスタックのため）。
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "デプロイ先のstage"
        required: true
        type: choice
        options:
          - stable
          - canary
      force:
        description: "canaryが占有中（promote-canary.ymlの猶予期間カウント中）でも強制デプロイする（issue #1538）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OPS_ALERT_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.OPS_ALERT_LINE_CHANNEL_ACCESS_TOKEN }}
      OPS_ALERT_LINE_USER_ID: ${{ secrets.OPS_ALERT_LINE_USER_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # issue #1538: このworkflowはpromote-canary.ymlの「canaryが空いていない
      # 限り新規変更をキューイングする」設計（issue #1449）を素通りし、直接
      # canaryスタックへデプロイしてしまう。これによりcanaryのLastUpdatedTime
      # が書き換わり、昇格猶予期間の起点が意図せず前進する事故が実際に起きた。
      # canaryが占有中（スタックが存在しforce_stableでない）場合は、force
      # 入力が無い限りデプロイを停止する
      - name: canaryの占有状態を確認する（stage=canaryのみ）
        if: inputs.stage == 'canary' && inputs.force != true
        working-directory: infra
        run: |
          set -eu
          npm ci
          if ! aws cloudformation describe-stacks --stack-name karuta-app-canary >/dev/null 2>&1; then
            echo "canaryスタックは存在しない（空き状態）ため、デプロイを続行する"
            exit 0
          fi
          INFO=$(npx osls info --config serverless.yml --stage shared --verbose 2>/dev/null)
          KVS_ARN=$(echo "$INFO" | grep "RoutingKeyValueStoreArn" | sed -E 's/^[^:]*: *//')
          FORCE_STABLE=$(aws cloudfront-keyvaluestore get-key --region us-east-1 --kvs-arn "$KVS_ARN" --key "force_stable" --query Value --output text 2>/dev/null || echo "false")
          if [ "$FORCE_STABLE" = "true" ]; then
            echo "force_stable=trueのため、canaryは空き状態とみなしデプロイを続行する"
            exit 0
          fi
          echo "::error::canaryは現在占有中（promote-canary.ymlの猶予期間カウント中）です。このworkflowで直接デプロイすると、canaryのLastUpdatedTimeが書き換わり昇格スケジュールが意図せず延長されます。通常の変更はcd.ymlのマージ経路（canary_queue_pending=true）でキューイングされ、canaryが空いた時点で反映されます。緊急時のみforce入力をtrueにして再実行してください。"
          exit 1

      - name: 🚀 Deploy Backend (osls, Serverless Framework v3 OSS fork)
        uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v2.71.2
        with:
          working-directory: backend
          node-version: 22
          deploy-command: npx osls deploy --stage ${{ inputs.stage }}
          workspaces: true
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Show endpoints
        working-directory: backend
        run: |
          set -eu
          INFO=$(npx osls info --stage ${{ inputs.stage }} --verbose 2>/dev/null)
          echo "$INFO"
          {
            echo "## backend デプロイ結果（stage: ${{ inputs.stage }}）"
            echo ""
            echo '```'
            echo "$INFO"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
