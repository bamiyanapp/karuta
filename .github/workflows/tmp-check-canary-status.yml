name: TMP Check canary stack status

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - name: Check stack status
        run: |
          set -eu
          aws cloudformation describe-stacks --stack-name karuta-app-canary --query "Stacks[0].{Status:StackStatus,LastUpdated:LastUpdatedTime,StatusReason:StackStatusReason}" --output json
