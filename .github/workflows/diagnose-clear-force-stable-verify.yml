name: Diagnose clear-force-stable verify (issue #1668)
run-name: Diagnose clear-force-stable verify

# issue #1668の調査専用の一時workflow。サンドボックス実行環境からは本番
# CloudFrontドメインへ直接アクセスできないため（CLAUDE.md「開発環境の制約
# （スマホオンリー）」・sandbox-unreachable-investigation Skill参照）、
# GitHub Actions経由で実際のレスポンス本文を取得し、clear-force-stable.yml・
# rollback-to-stable.ymlのverifyステップが前提とする"CANARY"/"STABLE"
# マーカー文字列が実際にレスポンスへ含まれているかを確認する。
# 調査完了後、本ファイルは削除するPRを別途出す。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Node.jsをセットアップする
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: infra依存パッケージをインストールする
        working-directory: infra
        run: npm ci

      - name: CloudFrontドメインを解決する
        id: resolve
        working-directory: infra
        run: |
          set -eu
          INFO=$(npx osls info --config serverless.yml --stage shared --verbose 2>/dev/null)
          DOMAIN=$(echo "$INFO" | grep "FrontendDistributionDomainName" | sed -E 's/^[^:]*: *//')
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: canary Cookie付き・無しでレスポンス本文を取得する
        run: |
          set -eu
          DOMAIN="${{ steps.resolve.outputs.domain }}"
          {
            echo "## issue #1668 診断結果"
            echo ""
            echo "対象ドメイン: ${DOMAIN}"
            echo ""

            echo "### canary Cookie付きレスポンス（/）"
            echo ""
            echo '```'
            curl -sS "https://${DOMAIN}/" --max-time 15 -b "canary=canary" -D - -o /tmp/body_canary.html || echo "curl failed"
            echo '```'
            echo ""
            echo "本文中のCANARY/STABLE（大文字）マーカー検索結果:"
            echo '```'
            grep -o "CANARY\|STABLE" /tmp/body_canary.html || echo "(見つからなかった)"
            echo '```'
            echo ""
            echo "本文の先頭1000文字:"
            echo '```html'
            head -c 1000 /tmp/body_canary.html
            echo ""
            echo '```'
            echo ""

            echo "### Cookie無しレスポンス（/）"
            echo ""
            echo '```'
            curl -sS "https://${DOMAIN}/" --max-time 15 -D - -o /tmp/body_none.html || echo "curl failed"
            echo '```'
            echo ""
            echo "本文中のCANARY/STABLE（大文字）マーカー検索結果:"
            echo '```'
            grep -o "CANARY\|STABLE" /tmp/body_none.html || echo "(見つからなかった)"
            echo '```'
            echo ""

            echo "### stable Cookie付きレスポンス（/）"
            echo ""
            curl -sS "https://${DOMAIN}/" --max-time 15 -b "canary=stable" -o /tmp/body_stable.html || echo "curl failed"
            echo "本文中のCANARY/STABLE（大文字）マーカー検索結果:"
            echo '```'
            grep -o "CANARY\|STABLE" /tmp/body_stable.html || echo "(見つからなかった)"
            echo '```'

            echo ""
            echo "### /canary/version.json・/stable/version.json"
            echo ""
            echo '```'
            curl -sS "https://${DOMAIN}/canary/version.json" --max-time 15 || echo "(取得失敗)"
            echo ""
            curl -sS "https://${DOMAIN}/stable/version.json" --max-time 15 || echo "(取得失敗)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
