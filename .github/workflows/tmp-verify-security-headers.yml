# dev-standards#1615の実機確認用の一時workflow。確認後に削除する（tmp-接頭辞）
name: Tmp verify security headers

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: "本番のセキュリティヘッダーを実測する"
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - name: dev-standardsのスクリプトを取得する
        uses: actions/checkout@v7
        with:
          repository: bamiyanapp/dev-standards
          ref: v2.184.0
          path: .dev-standards-actions
          sparse-checkout: scripts/verify-security-headers.js
          persist-credentials: false
      - name: CloudFrontのドメインを解決する
        id: domain
        run: |
          set -eu
          DOMAIN=$(aws cloudformation describe-stacks --stack-name karuta-infra-shared --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionDomainName'].OutputValue" --output text)
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
      - name: ヘッダーを実測する
        env:
          DOMAIN: ${{ steps.domain.outputs.domain }}
        run: |
          set -eu
          node .dev-standards-actions/scripts/verify-security-headers.js warn "https://${DOMAIN}/" "https://${DOMAIN}/stable/" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
