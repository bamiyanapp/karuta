name: Dependency Full Vulnerability Scan
run-name: Dependency Full Vulnerability Scan (${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }})

# dev-standards issue #1095。通常のRisk Summary（reusable-ci.ymlの
# dependency-risk-summary job）は更新PR（package-lock.jsonの変更）が存在する
# 場合にのみ脆弱性検知が動く。間接依存は親パッケージのバージョン範囲内で解決
# されるため、親パッケージ自体がrange外の新しいバージョンを必要とする脆弱性
# 修正を取り込めない場合、Renovateは通常検知できない（lockFileMaintenance有効化
# 後も残るギャップ、dev-standards issue #1094参照）。本workflowは更新PRの有無に
# 関わらず、現時点でロックされている依存パッケージ全体を定期的にスキャンする
# （dependency-deprecation-scan.ymlと同じ構成）
on:
  schedule:
    - cron: "30 15 * * 1" # 毎週月曜 00:30 JST（UTC 15:30、日曜）。
    # dependency-deprecation-scan.ymlと同時刻にならないよう30分ずらす
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  scan:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-dependency-full-scan.yml@v2.104.1
    with:
      lockfile_path: package-lock.json
