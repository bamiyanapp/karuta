name: Diagnose clear-force-stable verify failure
run-name: Diagnose clear-force-stable verify failure (manual, issue #1668)

# issue #1668の調査用一時workflow。sandbox-unreachable-investigation Skill参照。
# clear-force-stable.ymlのverifyジョブが、canary Cookie付きアクセスで常に
# CANARY判定を検出できない原因を特定する。infra/serverless.ymlのKVS値
# （force_stable・canary_exists）と、実際のcanary/stable両Cookieでの
# レスポンス（ステータスコード・本文冒頭）を取得し比較する。
#
# 調査完了後、本ファイルは削除するPRを別途出す（本線に使い捨てファイルを残さない）。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Resolve domain, KVS ARN and current KVS values
        id: resolve
        working-directory: infra
        run: |
          set -eu
          INFO=$(npx osls info --config serverless.yml --stage shared --verbose 2>/dev/null)
          DOMAIN=$(echo "$INFO" | grep "FrontendDistributionDomainName" | sed -E 's/^[^:]*: *//')
          KVS_ARN=$(echo "$INFO" | grep "RoutingKeyValueStoreArn" | sed -E 's/^[^:]*: *//')
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "kvs_arn=${KVS_ARN}" >> "$GITHUB_OUTPUT"

          get_kvs() {
            aws cloudfront-keyvaluestore get-key --region us-east-1 --kvs-arn "$KVS_ARN" --key "$1" --query Value --output text 2>/dev/null || echo "(未設定)"
          }

          {
            echo "## issue #1668 調査結果"
            echo ""
            echo "### KVS現在値"
            echo ""
            echo "- domain: ${DOMAIN}"
            echo "- force_stable: $(get_kvs force_stable)"
            echo "- canary_exists: $(get_kvs canary_exists)"
            echo "- canary_weight: $(get_kvs canary_weight)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Check canary/stable Cookie routing (status code + body head)
        run: |
          set -eu
          DOMAIN="${{ steps.resolve.outputs.domain }}"

          check() {
            COOKIE_VALUE="$1"
            STATUS=$(curl -sS -o /tmp/body.html -w "%{http_code}" "https://${DOMAIN}/" --max-time 15 -b "canary=${COOKIE_VALUE}")
            echo "--- cookie=canary=${COOKIE_VALUE} ---"
            echo "HTTP status: ${STATUS}"
            echo "body (head -c 300):"
            head -c 300 /tmp/body.html
            echo ""
            echo ""
          }

          {
            echo ""
            echo "### Cookie別レスポンス"
            echo ""
            echo '```'
            check canary
            check stable
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
