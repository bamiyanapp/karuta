name: Canary Status
run-name: Canary Status (manual)

# issue #1462: canaryの運用状態（現在の重み・ロールバック状態・キュー待ち・
# canaryスタックの最終更新時刻・昇格予定日時）は、CloudFront KVSと
# CloudFormationスタックの情報をAWS CLIで見るしかなく、PR・CIのログからは
# 掴めなかった。スマートフォンのGitHub Actions画面から手動実行するだけで
# 現在の状態をJob Summaryへ出力する、デプロイを一切行わない状態確認専用の
# workflow。昇格猶予期間（GRACE_PERIOD_HOURS）はpromote-canary.ymlと同じ値を使う
#
# issue #1472: Job Summaryは実行ごとに使い捨てで、Gitからは可視化できな
# かった。取得結果をdocs/generated/canary-status.mdへコミットすることで、
# スマートフォンからGitHubのファイルビュー・コミット履歴だけで最新状態を
# 確認できるようにする
#
# issue #1597〜#1902の経緯（1時間おきの独自schedule→1日1回→
# promote-canary.yml完了トリガー→独自schedule削除→workflow_run自体の削除）
# により、現在はworkflow_dispatchのみ（スマートフォンからの手動実行専用）。
# 「キューイング中の変更」一覧は、次回のpromote-canary.yml実行（1日1回）または
# 手動実行まで更新が遅れるが、運用状態確認という性質上許容範囲と判断する
#
# karuta#1913・dev-standards#1196（#1199〜#1203）: 状態取得・Job Summary
# 出力・docs/generated/への反映・force_stable放置検知・直近実行取得ロジック
# 自体は、後からdev-standards側で`reusable-canary-status.yml`へ一般化された。
# KVS ARN・backend URLの解決方法（osls info）はプロダクト固有のためkaruta側に
# 残し、それ以外は共通workflowへ委譲する。これにより、promote-canary.ymlが
# reusable-promote-canary.ymlを呼び出す構成（dev-standards#757）と同様の形に
# なった
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  resolve:
    name: "KVS ARN・backend URLを解決する"
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
    outputs:
      kvs_arn: ${{ steps.kvs.outputs.kvs_arn }}
      frontend_domain: ${{ steps.kvs.outputs.frontend_domain }}
      canary_backend_url: ${{ steps.canary_url.outputs.backend-url }}
      stable_backend_url: ${{ steps.stable_url.outputs.backend-url }}
    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Node.jsをセットアップする
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # issue #1601: npm workspaces構成（issue #608）ではルートに単一の
      # package-lock.jsonしかないため、依存インストールはリポジトリルートで
      # 1回にまとめる（infra・backend両方のworkspaceが対象）
      - name: 依存パッケージをインストールする
        run: npm ci

      - name: KVS ARN・フロントエンド配信ドメインを解決する
        id: kvs
        working-directory: infra
        run: |
          set -eu
          INFO=$(npx osls info --config serverless.yml --stage shared --verbose 2>/dev/null)
          KVS_ARN=$(echo "$INFO" | grep "RoutingKeyValueStoreArn" | sed -E 's/^[^:]*: *//')
          echo "kvs_arn=${KVS_ARN}" >> "$GITHUB_OUTPUT"
          FRONTEND_DOMAIN=$(echo "$INFO" | grep "FrontendDistributionDomainName" | sed -E 's/^[^:]*: *//')
          echo "frontend_domain=${FRONTEND_DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: canaryのbackend URLを解決する
        id: canary_url
        uses: bamiyanapp/dev-standards/.github/actions/resolve-serverless-backend-url@v2.114.6
        with:
          stage: canary
          working-directory: backend

      - name: stableのbackend URLを解決する
        id: stable_url
        uses: bamiyanapp/dev-standards/.github/actions/resolve-serverless-backend-url@v2.114.6
        with:
          stage: stable
          working-directory: backend

  status:
    name: "運用状態を可視化する"
    needs: resolve
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-canary-status.yml@v2.114.6
    with:
      canary_stack_name: karuta-app-canary
      stable_stack_name: karuta-app-stable
      kvs_arn: ${{ needs.resolve.outputs.kvs_arn }}
      # issue #1610・#1652相当。promote-canary.ymlと同じ値（時間単位）を使う
      grace_period_hours: 20
      canary_backend_url: ${{ needs.resolve.outputs.canary_backend_url }}
      stable_backend_url: ${{ needs.resolve.outputs.stable_backend_url }}
      frontend_domain: ${{ needs.resolve.outputs.frontend_domain }}
      # issue #1622相当。過去のコミット履歴対応分（Feat/fix・Fix/tech）も含めた
      # karuta独自のconventional commitsタイプ判定。既定値より広い
      release_type_regex: '^(feat|fix|refactor|feat/fix|fix/tech)(\(|!|:)'
      self_ref: v2.114.2
      docs_output_path: docs/generated/canary-status.md
      rollback_set_true_workflow: rollback-to-stable.yml
      rollback_set_false_workflow: clear-force-stable.yml
      rollback_max_age_hours: 24
      promote_workflow_file: promote-canary.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
