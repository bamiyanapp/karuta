name: Canary Status
run-name: Canary Status (${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }})

# issue #1462: canaryの運用状態（現在の重み・ロールバック状態・キュー待ち・
# canaryスタックの最終更新時刻・昇格予定日時）は、CloudFront KVSと
# CloudFormationスタックの情報をAWS CLIで見るしかなく、PR・CIのログからは
# 掴めなかった。スマートフォンのGitHub Actions画面から手動実行するだけで
# 現在の状態をJob Summaryへ出力する、デプロイを一切行わない状態確認専用の
# workflow。昇格猶予期間（GRACE_PERIOD_DAYS）はpromote-canary.ymlと同じ値を使う
#
# issue #1472: Job Summaryは実行ごとに使い捨てで、Gitからは可視化できな
# かった。1時間おきのscheduleで自動実行し、取得結果をdocs/generated/
# canary-status.mdへコミットすることで、スマートフォンからGitHubの
# ファイルビュー・コミット履歴だけで最新状態を確認できるようにする
on:
  schedule:
    - cron: "6 * * * *" # 1時間おき（分を0からずらし、他ワークフローとの同時実行集中を避ける）
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # issue #1475: canary最終更新以降のコミット履歴からPRリンクを抽出するために全履歴が必要

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: KVS ARNを解決する
        id: kvs
        working-directory: infra
        run: |
          set -eu
          INFO=$(npx osls info --config serverless.yml --stage shared --verbose 2>/dev/null)
          KVS_ARN=$(echo "$INFO" | grep "RoutingKeyValueStoreArn" | sed -E 's/^[^:]*: *//')
          echo "kvs_arn=${KVS_ARN}" >> "$GITHUB_OUTPUT"

      - name: 現在の運用状態を取得する
        id: status
        run: |
          set -eu
          GRACE_PERIOD_DAYS=1 # promote-canary.ymlと同じ値（issue #1442）
          KVS_ARN="${{ steps.kvs.outputs.kvs_arn }}"

          # issue #1481: URLだけでは判別できないため、タイトル付きのMarkdownリンクとして
          # 表示する。squash mergeのコミット件名は末尾の"(#1234)"を除けばPRタイトル
          # そのものなので、GitHub APIを呼ばずに件名から直接組み立てる
          pr_link() {
            local subject="$1"
            local num title
            num=$(echo "$subject" | grep -oE '#[0-9]+\)$' | tr -d '#)')
            title=$(echo "$subject" | sed -E 's/ *\(#[0-9]+\)$//')
            echo "- [#${num} ${title}](https://github.com/bamiyanapp/karuta/pull/${num})"
          }

          CANARY_WEIGHT=$(aws cloudfront-keyvaluestore get-key --region us-east-1 --kvs-arn "$KVS_ARN" --key "canary_weight" --query Value --output text 2>/dev/null || echo "（未設定）")
          FORCE_STABLE=$(aws cloudfront-keyvaluestore get-key --region us-east-1 --kvs-arn "$KVS_ARN" --key "force_stable" --query Value --output text 2>/dev/null || echo "false")
          PENDING=$(aws cloudfront-keyvaluestore get-key --region us-east-1 --kvs-arn "$KVS_ARN" --key "canary_queue_pending" --query Value --output text 2>/dev/null || echo "false")
          echo "canary_weight=${CANARY_WEIGHT}" >> "$GITHUB_OUTPUT"
          echo "force_stable=${FORCE_STABLE}" >> "$GITHUB_OUTPUT"
          echo "canary_queue_pending=${PENDING}" >> "$GITHUB_OUTPUT"

          if ! aws cloudformation describe-stacks --stack-name karuta-app-canary >/dev/null 2>&1; then
            echo "canary_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "canary_exists=true" >> "$GITHUB_OUTPUT"

          LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name karuta-app-canary --query "Stacks[0].LastUpdatedTime" --output text)
          if [ "$LAST_UPDATED" = "None" ]; then
            LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name karuta-app-canary --query "Stacks[0].CreationTime" --output text)
          fi
          LAST_UPDATED_EPOCH=$(date -d "$LAST_UPDATED" +%s)
          echo "canary_last_updated=$(TZ=Asia/Tokyo date -d "@${LAST_UPDATED_EPOCH}" +"%Y-%m-%d %H:%M:%S JST")" >> "$GITHUB_OUTPUT"

          ELIGIBLE_EPOCH=$(( LAST_UPDATED_EPOCH + GRACE_PERIOD_DAYS * 86400 ))
          ELIGIBLE_AT=$(TZ=Asia/Tokyo date -d "@${ELIGIBLE_EPOCH}" +"%Y-%m-%d %H:%M:%S JST")
          echo "promotion_eligible_at=${ELIGIBLE_AT}" >> "$GITHUB_OUTPUT"

          # issue #1475: canaryの最終更新以降にmainへマージされたPRをリンクで示す。
          # squash mergeのコミットメッセージ末尾に付くGitHub標準の"(#1234)"形式を
          # 持つ件名のみを対象とする（重複は保持順でuniqする）
          PR_SUBJECTS=$(git log --since="$LAST_UPDATED" --pretty=format:'%s' origin/main | grep -E '\(#[0-9]+\)$' | awk '!seen[$0]++')
          {
            echo "queued_pr_links<<PR_LINKS_EOF"
            if [ -n "$PR_SUBJECTS" ]; then
              while IFS= read -r subject; do
                pr_link "$subject"
              done <<< "$PR_SUBJECTS"
            else
              echo "（該当するPRが見つからなかった）"
            fi
            echo "PR_LINKS_EOF"
          } >> "$GITHUB_OUTPUT"

          # issue #1478: 「canaryには反映済みだがstableへはまだ昇格していない」PRを
          # 区別して示す。stableスタックのLastUpdatedTime（promote-canary.ymlの
          # stable_ahead_of_canary判定と同じ取得方法）からcanaryの最終更新時刻までの
          # 間にmainへマージされたPRが対象
          if aws cloudformation describe-stacks --stack-name karuta-app-stable >/dev/null 2>&1; then
            STABLE_LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name karuta-app-stable --query "Stacks[0].LastUpdatedTime" --output text)
            if [ "$STABLE_LAST_UPDATED" = "None" ]; then
              STABLE_LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name karuta-app-stable --query "Stacks[0].CreationTime" --output text)
            fi
            STABLE_LAST_UPDATED_EPOCH=$(date -d "$STABLE_LAST_UPDATED" +%s)
            echo "stable_last_updated=$(TZ=Asia/Tokyo date -d "@${STABLE_LAST_UPDATED_EPOCH}" +"%Y-%m-%d %H:%M:%S JST")" >> "$GITHUB_OUTPUT"

            if [ "$STABLE_LAST_UPDATED_EPOCH" -gt "$LAST_UPDATED_EPOCH" ]; then
              # promote-canary.ymlのstable_ahead_of_canaryと同じ状態（緊急デプロイ等で
              # stableがcanaryを追い越している）。この場合「反映済み・昇格待ち」の
              # 区間自体が存在しないため対象外とする
              IN_CANARY_PR_SUBJECTS=""
            else
              IN_CANARY_PR_SUBJECTS=$(git log --since="$STABLE_LAST_UPDATED" --until="$LAST_UPDATED" --pretty=format:'%s' origin/main | grep -E '\(#[0-9]+\)$' | awk '!seen[$0]++')
            fi
          else
            echo "stable_last_updated=" >> "$GITHUB_OUTPUT"
            IN_CANARY_PR_SUBJECTS=""
          fi
          {
            echo "in_canary_pr_links<<IN_CANARY_LINKS_EOF"
            if [ -n "$IN_CANARY_PR_SUBJECTS" ]; then
              while IFS= read -r subject; do
                pr_link "$subject"
              done <<< "$IN_CANARY_PR_SUBJECTS"
            else
              echo "（該当するPRが見つからなかった）"
            fi
            echo "IN_CANARY_LINKS_EOF"
          } >> "$GITHUB_OUTPUT"

      # issue #1523: canaryが古いバージョンを配信し続けていた不具合（issue #1511）の
      # 調査時、実際にどのバージョンが配信されているかをドキュメントから確認できず、
      # 実機のブラウザ確認に頼る必要があった。各stageの/get-versionエンドポイント
      # （backend/handler.js、issue #1462で追加済み）を叩き、配信中のバージョンを
      # 取得する。疎通不可の場合も他の取得処理と同様にエラーにせず「取得できなかった」
      # 旨を表示する
      - name: canary/stableの配信中バージョンを取得する
        id: version
        run: |
          set -eu
          fetch_version() {
            local url="$1"
            local body
            if ! body=$(curl -fsS --max-time 10 "${url}/get-version" 2>/dev/null); then
              echo "（取得できなかった）"
              return
            fi
            local version
            version=$(echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).version||'（取得できなかった）')}catch{console.log('（取得できなかった）')}})")
            echo "$version"
          }
          CANARY_VERSION=$(fetch_version "$(grep -oE 'https://[^ ]+' frontend/.env.canary | head -1)")
          STABLE_VERSION=$(fetch_version "$(grep -oE 'https://[^ ]+' frontend/.env.stable | head -1)")
          echo "canary_version=${CANARY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "stable_version=${STABLE_VERSION}" >> "$GITHUB_OUTPUT"

      # issue #1472: 「現在の状態」だけでなく「いつ次の判定が走るか」（適用スケジュール
      # 観点）も合わせて示す。promote-canary.ymlのcronスケジュール自体は固定（毎日
      # UTC 17:37）なので、今から見た直近の次回実行時刻を計算する
      - name: 次回promote-canary.yml実行予定を計算する
        id: schedule
        run: |
          set -eu
          NOW_EPOCH=$(date -u +%s)
          TODAY_RUN_EPOCH=$(date -u -d "today 17:37" +%s)
          if [ "$NOW_EPOCH" -lt "$TODAY_RUN_EPOCH" ]; then
            NEXT_RUN_EPOCH=$TODAY_RUN_EPOCH
          else
            NEXT_RUN_EPOCH=$(date -u -d "tomorrow 17:37" +%s)
          fi
          NEXT_RUN_AT=$(TZ=Asia/Tokyo date -d "@${NEXT_RUN_EPOCH}" +"%Y-%m-%d %H:%M:%S JST")
          echo "next_promote_run_at=${NEXT_RUN_AT}" >> "$GITHUB_OUTPUT"

      - name: Write summary
        if: always()
        run: |
          set -eu
          {
            echo "## canary運用状態（issue #1462）"
            echo ""
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| canary_weight（canaryへ振り分ける割合） | ${{ steps.status.outputs.canary_weight }}% |"
            echo "| force_stable（管理者ロールバック中か） | ${{ steps.status.outputs.force_stable }} |"
            echo "| canary_queue_pending（反映待ちのマージがあるか） | ${{ steps.status.outputs.canary_queue_pending }} |"
            echo "| canaryスタックが存在するか | ${{ steps.status.outputs.canary_exists }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.status.outputs.canary_exists }}" = "true" ]; then
            {
              echo "| stableの最終更新 | ${{ steps.status.outputs.stable_last_updated || '（stableスタックが存在しない）' }} |"
              echo "| stableの配信中バージョン | ${{ steps.version.outputs.stable_version }} |"
              echo "| canaryの最終更新 | ${{ steps.status.outputs.canary_last_updated }} |"
              echo "| canaryの配信中バージョン | ${{ steps.version.outputs.canary_version }} |"
              echo "| 本番昇格の条件を満たす日時 | ${{ steps.status.outputs.promotion_eligible_at }}以降 |"
              echo "| 次回の定期チェック予定 | ${{ steps.schedule.outputs.next_promote_run_at }} |"
              echo ""
              echo "### canaryに反映済み・stable昇格待ちの変更"
              echo ""
              echo "${{ steps.status.outputs.in_canary_pr_links }}"
              echo ""
              echo "### キューイング中の変更（canaryにも未反映・canary最終更新以降にmainへマージされたPR）"
              echo ""
              echo "${{ steps.status.outputs.queued_pr_links }}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "| 次回の定期チェック予定 | ${{ steps.schedule.outputs.next_promote_run_at }} |"
              echo ""
              echo "canaryスタックは現在存在しない。マージ済みでキュー待ち（canary_queue_pending=true）であれば、次回のpromote-canary.yml実行で最新main HEADがcanaryへデプロイされる。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # issue #1472: Gitから可視化できるよう、Job Summaryと同じ内容を
      # リポジトリ内のファイルへも書き出す
      - name: docs/generated/canary-status.mdを生成する
        if: always()
        run: |
          set -eu
          {
            echo "# canary運用状態"
            echo ""
            echo "このファイルは\`canary-status.yml\`（1時間おきのスケジュール実行）が自動更新する。手動で編集しないこと。"
            echo ""
            echo "最終更新日時: $(TZ=Asia/Tokyo date +"%Y-%m-%d %H:%M:%S JST")。"
            echo ""
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| canary_weight（canaryへ振り分ける割合） | ${{ steps.status.outputs.canary_weight }}% |"
            echo "| force_stable（管理者ロールバック中か） | ${{ steps.status.outputs.force_stable }} |"
            echo "| canary_queue_pending（反映待ちのマージがあるか） | ${{ steps.status.outputs.canary_queue_pending }} |"
            echo "| canaryスタックが存在するか | ${{ steps.status.outputs.canary_exists }} |"
          } > docs/generated/canary-status.md
          if [ "${{ steps.status.outputs.canary_exists }}" = "true" ]; then
            {
              echo "| stableの最終更新 | ${{ steps.status.outputs.stable_last_updated || '（stableスタックが存在しない）' }} |"
              echo "| stableの配信中バージョン | ${{ steps.version.outputs.stable_version }} |"
              echo "| canaryの最終更新 | ${{ steps.status.outputs.canary_last_updated }} |"
              echo "| canaryの配信中バージョン | ${{ steps.version.outputs.canary_version }} |"
              echo "| 本番昇格の条件を満たす日時 | ${{ steps.status.outputs.promotion_eligible_at }}以降 |"
              echo "| 次回の定期チェック予定 | ${{ steps.schedule.outputs.next_promote_run_at }} |"
              echo ""
              echo "## canaryに反映済み・stable昇格待ちの変更"
              echo ""
              echo "stableの最終更新からcanaryの最終更新までの間にmainへマージされたPRの一覧。これらはすでにcanary（canary_weightの割合）には反映済みだが、まだstable（残りの割合）には昇格していない。"
              echo ""
              echo "${{ steps.status.outputs.in_canary_pr_links }}"
              echo ""
              echo "## キューイング中の変更"
              echo ""
              echo "canary最終更新以降にmainへマージされたPRの一覧。canaryにもまだ反映されていない。これらは次回canary更新時にまとめて反映される。"
              echo ""
              echo "${{ steps.status.outputs.queued_pr_links }}"
            } >> docs/generated/canary-status.md
          else
            {
              echo "| 次回の定期チェック予定 | ${{ steps.schedule.outputs.next_promote_run_at }} |"
              echo ""
              echo "canaryスタックは現在存在しない。マージ済みでキュー待ち（canary_queue_pending=true）であれば、次回のpromote-canary.yml実行で最新main HEADがcanaryへデプロイされる。"
            } >> docs/generated/canary-status.md
          fi

      # issue #1507: mainブランチはリポジトリルール（Rulesets）で「変更は必ずPR経由」
      # となっており、mainへの直接push（git push origin HEAD:main）はGH013エラーで
      # 常に拒否される。issue #1501で追加したリトライ（non-fast-forward対策）は
      # この拒否自体を解消できない（リトライしても毎回同じ理由で失敗する）。
      # reusable-ci.ymlのrender-mermaid-diagramsジョブと同じ「新ブランチへpush→
      # PR作成→API経由でsquash merge」方式に切り替える。PRのマージはAPI経由の
      # 操作であり「変更は必ずPR経由」のルール自体を満たす
      - name: 変更があればコミットする
        id: commit
        if: always()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/generated/canary-status.md; then
            echo "変更なし。コミットをスキップする。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add docs/generated/canary-status.md
          git commit -m "chore(canary): canary運用状態を更新する [skip ci]"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 新規ブランチへのpushはmainのルール対象外。force pushにしているのは、
      # 過去の失敗試行で同名ブランチが残骸として残っていると、通常のpushが
      # non-fast-forwardで拒否され以後の実行が恒久的に失敗し続けるため
      # （reusable-ci.ymlの同種ステップ・dev-standards#481と同根の対策）
      - name: コミットを新しいブランチへpushする
        id: push-branch
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -eu
          BRANCH="chore/canary-status-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git push --force origin "$BRANCH"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: PRを作成してsquash mergeする
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const branch = "${{ steps.push-branch.outputs.branch }}";
            const baseBranch = "${{ github.ref_name }}";

            let pr;
            try {
              ({ data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: branch,
                base: baseBranch,
                title: "chore(canary): canary運用状態を更新する [skip ci]",
                body: "canary-status.ymlによる自動PRです（issue #1507）。",
              }));
              console.log(`Created canary-status PR #${pr.number}`);
            } catch (error) {
              if (!error.message.includes("A pull request already exists")) {
                throw error;
              }
              const { data: existingPrs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: "open",
              });
              if (existingPrs.length === 0) {
                throw error;
              }
              pr = existingPrs[0];
              console.log(`Reusing existing canary-status PR #${pr.number}`);
            }

            // pushで作成したブランチ直後はGitHub側のmergeable判定が追いついていない
            // ことがあるため、短い間隔でリトライする
            const maxAttempts = 5;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: "squash",
                });
                console.log(`Successfully merged canary-status PR #${pr.number}`);
                break;
              } catch (error) {
                if (attempt === maxAttempts) {
                  console.error(`Failed to merge canary-status PR #${pr.number}:`, error.message);
                  throw error;
                }
                console.log(`Merge attempt ${attempt} failed (${error.message}), retrying...`);
                await new Promise((resolve) => setTimeout(resolve, attempt * 3000));
              }
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
            } catch (error) {
              if (!(error.status === 422 || error.message.includes("Reference does not exist"))) {
                console.error(`Failed to delete branch ${branch}:`, error.message);
              }
            }
