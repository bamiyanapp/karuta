name: Dependency Deprecation Scan
run-name: Dependency Deprecation Scan (${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }})

# issue #1693（bamiyanapp/dev-standards#969）。元々の発生源は#1656・#1658
# （Dependabotの「Dependabot Updates」workflowが継続的に失敗していた問題の調査で、
# aws-sdk v2がAWS公式によりメンテナンスモード・サポート終了とされ、npm registry上も
# deprecatedフラグが付いていたことが判明した）。
#
# 通常のRisk Summary（reusable-ci.ymlのdependency-risk-summary job）は更新PR
# （package-lock.jsonの変更）が存在する場合にのみdeprecated検知が動く。後継バージョン
# 自体が存在しないまま非推奨化されたパッケージは、Renovateが更新PRを作らないため
# 一度も評価されない。本workflowは更新PRの有無に関わらず、現時点でロックされている
# 依存パッケージ全体を定期的にスキャンする
on:
  schedule:
    - cron: "0 15 * * 1" # 毎週月曜 00:00 JST（UTC 15:00、日曜）。deprecated状態は
    # 日次で変化するものではないため、他のcanary関連workflowより低頻度にする
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  scan:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-dependency-deprecation-scan.yml@v2.98.1
    with:
      lockfile_path: package-lock.json
      direct_only: true
