name: CD
run-name: CD ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main
permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-cd.yml@v1.3.1
    with:
      enable_release: true
      enable_changelog_json: true
      changelog_json_output_path: frontend/src/changelog.json
      enable_shared_release_config: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  build-and-deploy-frontend:
    needs: release
    if: success() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }} # CDをトリガーしたコミットを確実にデプロイする
          fetch-depth: 0
      # TODO(issue #608): bamiyanapp/dev-standards#89（deploy-github-pages
      # 複合actionのworkspaces対応）のマージ・リリース後、参照タグを更新した上で
      # `workspaces: true`を追加すること。npm workspaces構成への移行により
      # frontend/package-lock.jsonが存在しなくなったため、それまでは本ステップの
      # `npm ci`（working-directory: frontend）が失敗する
      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v1.4.0
        with:
          working-directory: frontend
          node-version: 24
          artifact-path: frontend/dist
      - name: Show GitHub Pages URL
        run: |
          echo "Pages URL: ${{ steps.deploy.outputs.page-url }}"

  deploy-backend:
    needs: release
    if: success() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }} # CDをトリガーしたコミットを確実にデプロイする
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json
      # npm workspaces構成（issue #608）。個々のパッケージにlockfileが無くなった
      # ため、リポジトリルートで一括インストールする（`.npmrc`のinstall-strategy=
      # nestedにより、backend/node_modules配下に実行時依存が完全な形で
      # 展開されるため、後段のserverless packagingへの影響は無い）
      - name: Install dependencies
        run: npm ci
      - name: 🚀 Deploy Backend (Serverless Framework)
        working-directory: backend
        run: npx serverless deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: 🌱 Seed Database
        working-directory: backend
        run: node seed.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
