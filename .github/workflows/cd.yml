name: CD
run-name: CD ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main
permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-cd.yml@v2.3.0
    with:
      enable_release: true
      enable_changelog_json: true
      changelog_json_output_path: frontend/src/changelog.json
      enable_shared_release_config: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  build-and-deploy-frontend:
    needs: release
    if: success() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }} # CDをトリガーしたコミットを確実にデプロイする
          fetch-depth: 0
      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v2.3.0
        with:
          working-directory: frontend
          node-version: 22 # backend Lambdaランタイムnodejs22.x・CI（issue #610）と統一する
          artifact-path: frontend/dist
          workspaces: true # npm workspaces構成（issue #608）。依存インストールをリポジトリルートで行う
      - name: Show GitHub Pages URL
        run: |
          echo "Pages URL: ${{ steps.deploy.outputs.page-url }}"

  deploy-backend:
    needs: release
    if: success() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }} # CDをトリガーしたコミットを確実にデプロイする
          fetch-depth: 0
      - name: 🚀 Deploy Backend (osls, Serverless Framework v3 OSS fork)
        # npm workspaces移行（issue #608）で`install-strategy=nested`にした結果、
        # 各Lambda関数のzip作成（package.individually: true、11関数）が同一の
        # node_modules配下を関数ごとに繰り返し走査するようになり、GitHub Actions
        # ランナーのデフォルトのファイルディスクリプタ上限（1024）を超えて
        # `EMFILE: too many open files`でデプロイが失敗する問題（issue #608のPR #654
        # マージ後の初回デプロイで実際に発生、#663でも別パッケージで再発）への対策
        # （ファイルディスクリプタ上限のハードリミットまでの引き上げ）を含め、
        # dev-standardsの共通複合action化した（bamiyanapp/dev-standards#147）
        uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v2.3.0
        with:
          working-directory: backend
          node-version: 22 # backend Lambdaランタイムnodejs22.x・CI（issue #610）と統一する
          deploy-command: npx osls deploy
          workspaces: true # npm workspaces構成（issue #608）。依存インストールをリポジトリルートで行う
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: 🌱 Seed Database
        working-directory: backend
        run: node seed.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
