name: CD
run-name: CD ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main
permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-cd.yml@v1.5.0
    with:
      enable_release: true
      enable_changelog_json: true
      changelog_json_output_path: frontend/src/changelog.json
      enable_shared_release_config: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  build-and-deploy-frontend:
    needs: release
    if: success() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }} # CDをトリガーしたコミットを確実にデプロイする
          fetch-depth: 0
      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v1.5.0
        with:
          working-directory: frontend
          node-version: 24
          artifact-path: frontend/dist
          workspaces: true # npm workspaces構成（issue #608）。依存インストールをリポジトリルートで行う
      - name: Show GitHub Pages URL
        run: |
          echo "Pages URL: ${{ steps.deploy.outputs.page-url }}"

  deploy-backend:
    needs: release
    if: success() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }} # CDをトリガーしたコミットを確実にデプロイする
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json
      # npm workspaces構成（issue #608）。個々のパッケージにlockfileが無くなった
      # ため、リポジトリルートで一括インストールする（`.npmrc`のinstall-strategy=
      # nestedにより、backend/node_modules配下に実行時依存が完全な形で
      # 展開されるため、後段のserverless packagingへの影響は無い）
      - name: Install dependencies
        run: npm ci
      - name: 🚀 Deploy Backend (Serverless Framework)
        working-directory: backend
        # npm workspaces移行（issue #608）で`install-strategy=nested`にした結果、
        # 各Lambda関数のzip作成（package.individually: true、11関数）が同一の
        # node_modules配下を関数ごとに繰り返し走査するようになり、GitHub Actions
        # ランナーのデフォルトのファイルディスクリプタ上限（1024）を超えて
        # `EMFILE: too many open files`でデプロイが失敗することを確認した
        # （issue #608のPR #654マージ後の初回デプロイで実際に発生）。
        # ソフトリミットをハードリミットまで引き上げて回避する
        run: |
          ulimit -n 65536
          npx serverless deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: 🌱 Seed Database
        working-directory: backend
        run: node seed.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
