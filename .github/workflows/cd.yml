name: CD
run-name: CD ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main
permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-cd.yml@v1.0.2
    with:
      enable_release: true
      enable_changelog_json: true
      changelog_json_output_path: frontend/src/changelog.json
      enable_shared_release_config: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  build-and-deploy-frontend:
    needs: release
    if: success() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }} # CDをトリガーしたコミットを確実にデプロイする
          fetch-depth: 0
      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v1.0.2
        with:
          working-directory: frontend
          node-version: 24
          artifact-path: frontend/dist
      - name: Show GitHub Pages URL
        run: |
          echo "Pages URL: ${{ steps.deploy.outputs.page-url }}"

  deploy-backend:
    needs: release
    if: success() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }} # CDをトリガーしたコミットを確実にデプロイする
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: 🚀 Deploy Backend (Serverless Framework)
        working-directory: backend
        run: npx serverless deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: 🌱 Seed Database
        working-directory: backend
        run: node seed.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
