<!doctype html>
<html lang="ja" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- LCP要素（TopViewChromeのヘッダーアイコン）をJSレンダリング前に取得開始させる
         （Lighthouse prioritize-lcp-image監査対応、karuta#1766） -->
    <link rel="preload" href="/app-icon.webp" as="image" type="image/webp" />
    <!-- viewport-fit=cover: PWAのstandaloneモード（vite.config.jsのdisplay: 'standalone'）
         では、iOSはこの指定がないとenv(safe-area-inset-*)を常に0として扱い、
         ノッチ・ステータスバー領域を考慮したレイアウト調整ができない（issue #840） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>かるた読み上げ</title>
    <!-- issue #2184: Lighthouse SEO監査（meta description）対応 -->
    <meta name="description" content="かるたの読み札を、音声で読み上げるWebアプリです。読み上げ速度の調整や、クイズ大会にも対応しています。" />
    <!-- issue #2189: CSPでインラインスクリプトを禁止するため、外部ファイルにしている。
         描画前に同期実行されるよう、<head>内の通常スクリプト（defer・asyncなし）で読み込む -->
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
