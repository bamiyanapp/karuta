service: karuta-infra

# issue #1319（ブルーグリーンデプロイ導入）Task 2（#1321）: フロントエンドを
# GitHub PagesからS3+CloudFrontへ移行するための最小インフラ。stable/canaryの
# デプロイ単位（backend/serverless.yml、将来的にはフロントエンドのビルドも
# stage別）とは独立した、固定の1つのスタックとして常時存在する
# （backend/serverless-data.ymlと同じ位置付け）。
#
# S3バケットは単一で、stable/canaryのビルド成果物をそれぞれ`stable/`・
# `canary/`プレフィックス配下に配置する。CloudFrontのデフォルトキャッシュ
# ビヘイビアはオリジンパスを設定しない（空）ため、リクエストパスがそのまま
# S3のキーに対応する（例: `/stable/index.html`→S3キー`stable/index.html`）。
# この結果、本タスクの時点ではprefixなしのルート（`/`）はS3バケット直下に
# 対応するオブジェクトが無いため404になる想定だが、それは正しい挙動である。
# ルートパスを実際にstable/canaryへ振り分けるのはTask 3（#1322）の
# CloudFront Functionsが担当する。viewer-request関数がevent.request.uriを
# 書き換えて`/stable`または`/canary`を付与する設計のため、デフォルト
# ビヘイビアのオリジンパスを空にしておく必要がある（関数側で付与した
# プレフィックスと、オリジンパス設定によるプレフィックスが二重にならない
# ようにするため）。
#
# デプロイは`npx osls deploy --config infra/serverless.yml --stage shared`で
# 手動実行する（issue #1321の受け入れ基準どおり）。CDパイプラインへの統合は
# Task 6（#1325）の範囲とする。CloudFrontディストリビューションの初回作成・
# 更新は伝播に15〜20分程度かかるため、頻繁に走る通常のCD（backend/frontendの
# デプロイ）とは別の、専用の手動ワークフローで管理する
# （.github/workflows/deploy-infra.yml参照）
#
# 【Task 3（#1322）: CloudFront Functions重み付けルーティング】
# viewer-request関数: canary Cookieが無い場合、KVS（RoutingKeyValueStore）の
# 重み（既定キー canary_weight、未設定時10%）に従ってstable/canaryを抽選し、
# URIへプレフィックスを付与する。KVSのforce_stableキーがtrueの場合は
# Cookieに関わらず常にstableにする。viewer-response関数: 新規抽選が発生した
# 場合のみ（force_stableによる強制時は発生しない）canary Cookie
# （Max-Age=1週間）を付与する。
#
# 関数コードはserverless.yml内に直接インラインで記述している（別ファイル
# 分割にしなかった理由: osls/Serverless Frameworkの`${file(...)}`変数は、
# 拡張子が.js/.cjsのファイルを「raw textではなくNode.jsモジュールとして
# require()した結果」として扱う。CloudFront Functionsのコードは
# `module.exports`を持たない素のハンドラ関数であるため、require()自体は
# エラーにならずに`{}`を返してしまい、FunctionCodeに空オブジェクトが
# 設定されるという気づきにくい不具合を引き起こす（実機検証で確認済み）。
# 拡張子を変えれば回避できるが、GitHubのdiffビューでのJS構文ハイライトを
# 諦めることになり実益が無いため、素直にインライン化した）
#
# KVSの初期値（canary_weight=10、force_stable=false）はCloudFormationでは
# 設定できない（AWS::CloudFront::KeyValueStoreのImportSourceはS3からの
# 一括インポートのみに対応し、個別キーの初期値指定はできない）。
# deploy-infra.yml側でaws cloudfront-keyvaluestore CLIを使い、スタック
# デプロイ後に未設定のキーのみ初期値を設定する（既存の値は上書きしない。
# Task 11（#1330、管理者ロールバックforce_stable）実装後、運用者が
# force_stableを手動でtrueにしている可能性があるため）

provider:
  name: aws
  region: ap-northeast-1
  deploymentMethod: direct # serverless-data.ymlと同じ理由（自動生成デプロイバケットを避ける）

resources:
  Resources:
    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: karuta-frontend-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    # CloudFrontからのみS3へアクセスさせるための現行の推奨方式（Origin Access
    # Control）。レガシーなOrigin Access Identityは新規では使わない
    FrontendOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: karuta-frontend-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref FrontendBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${FrontendBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${aws:accountId}:distribution/${FrontendDistribution.Id}"

    FrontendDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          # 独自ドメインは取得しない（issue #1319の決定済み設計）。CloudFrontの
          # 既定ドメイン（*.cloudfront.net）のままとする
          HttpVersion: http2
          IPV6Enabled: true
          Origins:
            - Id: FrontendS3Origin
              DomainName: !GetAtt FrontendBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
              # OriginAccessControlIdを使う場合もS3OriginConfigの指定自体は必要
              # （CloudFormationの仕様。OriginAccessIdentityは空文字でよい）
              S3OriginConfig:
                OriginAccessIdentity: ""
          DefaultCacheBehavior:
            TargetOriginId: FrontendS3Origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            # AWSマネージドポリシー「CachingOptimized」。静的サイトなので
            # オリジン側のキャッシュ制御ヘッダーに従ってCloudFront側でも
            # 効率よくキャッシュする既定値として適切
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            AllowedMethods:
              - GET
              - HEAD
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN
              - EventType: viewer-response
                FunctionARN: !GetAtt ViewerResponseFunction.FunctionMetadata.FunctionARN

    # issue #1322: stable/canaryの重み・強制切り替えフラグを保持するKVS。
    # 初期値設定・以後の更新はいずれもCloudFormationの外（aws
    # cloudfront-keyvaluestore CLI）で行う。再デプロイ無しで即座に反映される
    # ことが要件（issue #1322の検証項目）のため、CloudFormationのプロパティ
    # としては値を持たせない
    RoutingKeyValueStore:
      Type: AWS::CloudFront::KeyValueStore
      Properties:
        Name: karuta-bg-routing

    ViewerRequestFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: karuta-bg-viewer-request
        AutoPublish: true # trueにしないとLIVEステージへ反映されず、ディストリビューションから参照できない
        FunctionConfig:
          Comment: "issue #1322: stable/canaryへの重み付けルーティング（Cookie確認→KVS抽選→URIプレフィックス付与）"
          Runtime: cloudfront-js-2.0 # KVS参照にはruntime 2.0が必須
          KeyValueStoreAssociations:
            - KeyValueStoreARN: !GetAtt RoutingKeyValueStore.Arn
        FunctionCode: |
          import cf from 'cloudfront';

          var KVS_WEIGHT_KEY = 'canary_weight';
          var KVS_FORCE_STABLE_KEY = 'force_stable';
          var DEFAULT_WEIGHT_PERCENT = 10;
          var COOKIE_NAME = 'canary';
          var NEW_ASSIGNMENT_HEADER = 'x-bg-new-assignment';

          async function handler(event) {
              var request = event.request;

              // issue #1321の動作確認・Task 10（#1329、手動切り替えリンク）との
              // 前方互換のため、明示的に/stable/または/canary/で始まるリクエストは
              // 重み付け抽選を行わずそのまま通す。これが無いと、どのパスへの
              // アクセスでも常に重み付けで選ばれた側のプレフィックスが二重に
              // 付与されてしまい（例: /stable/index.html → /canary/stable/index.html）、
              // 存在しないキーへのアクセスとなる（実機検証で発覚。S3側はGetObjectのみ
              // 許可しListBucketを許可していないため、404ではなくAccess Deniedとして
              // 表面化する）
              var isExplicitStable = request.uri === '/stable' || request.uri.indexOf('/stable/') === 0;
              var isExplicitCanary = request.uri === '/canary' || request.uri.indexOf('/canary/') === 0;
              if (isExplicitStable || isExplicitCanary) {
                  if (request.uri.endsWith('/')) {
                      request.uri += 'index.html';
                  }
                  // issue #1328（Task 9、ErrorBoundary連動の自動フォールバック）:
                  // /stable/への明示アクセスを、今回のリクエストだけでなく以後の
                  // 通常アクセス（Cookie無し判定）でも継続してstableへ固定する。
                  // canaryの'canary' Cookieは`HttpOnly`のためクライアント側JSからは
                  // 書き換えられず、ErrorBoundary側からCookieを直接操作することが
                  // できない。そのため、/stable/への遷移そのものをきっかけに
                  // viewer-response側でCookieを'stable'へ上書きさせる
                  if (isExplicitStable) {
                      request.headers[NEW_ASSIGNMENT_HEADER] = { value: 'stable' };
                  }
                  return request;
              }

              var kvsHandle = cf.kvs();

              var forceStable = false;
              try {
                  var forceStableValue = await kvsHandle.get(KVS_FORCE_STABLE_KEY);
                  forceStable = forceStableValue === 'true';
              } catch (err) {
                  // KVSに未設定の場合は既定値(false)のまま進める
              }

              var bucket;
              var isNewAssignment = false;

              if (forceStable) {
                  bucket = 'stable';
              } else {
                  var existingCookie = request.cookies[COOKIE_NAME];
                  if (existingCookie && (existingCookie.value === 'stable' || existingCookie.value === 'canary')) {
                      bucket = existingCookie.value;
                  } else {
                      var weight = DEFAULT_WEIGHT_PERCENT;
                      try {
                          var weightValue = await kvsHandle.get(KVS_WEIGHT_KEY);
                          var parsedWeight = parseInt(weightValue, 10);
                          if (!isNaN(parsedWeight) && parsedWeight >= 0 && parsedWeight <= 100) {
                              weight = parsedWeight;
                          }
                      } catch (err) {
                          // KVSに未設定の場合は既定値(10)のまま進める
                      }
                      bucket = Math.random() * 100 < weight ? 'canary' : 'stable';
                      isNewAssignment = true;
                  }
              }

              request.uri = '/' + bucket + request.uri;
              // S3オリジン（REST APIエンドポイント）はURIが"/"で終わる場合に
              // index.htmlを自動補完しない（S3静的website hosting機能は未使用の
              // ため）。ルートパス("/")はプレフィックス付与だけでは
              // "/stable/"のようにスラッシュで終わってしまい404になる
              if (request.uri.endsWith('/')) {
                  request.uri += 'index.html';
              }

              if (isNewAssignment) {
                  request.headers[NEW_ASSIGNMENT_HEADER] = { value: bucket };
              }

              return request;
          }

    ViewerResponseFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: karuta-bg-viewer-response
        AutoPublish: true
        FunctionConfig:
          Comment: "issue #1322: 新規抽選時、または/stableへの明示アクセス時（issue #1328）にcanary Cookie（Max-Age=1週間）を付与する"
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
              var request = event.request;
              var response = event.response;

              var newAssignment = request.headers['x-bg-new-assignment'];
              if (newAssignment && newAssignment.value) {
                  response.cookies['canary'] = {
                      value: newAssignment.value,
                      attributes: 'Max-Age=604800; Path=/; Secure; HttpOnly; SameSite=Lax'
                  };
              }

              return response;
          }

  # serverless.yml直下のoutputs:はosls/Serverless Frameworkのスキーマに存在せず
  # 無視される（`Warning: Invalid configuration encountered at root:
  # unrecognized property 'outputs'`。実機デプロイで確認済み）。CloudFormation
  # の生のOutputsセクションに対応する、resources.Outputsを使う必要がある
  Outputs:
    FrontendDistributionDomainName:
      Value: !GetAtt FrontendDistribution.DomainName
    # Task 6（#1325）のCDワークフローが、ビルド成果物同期後に対象パスのみ
    # CloudFrontキャッシュを無効化するために使う（DefaultCacheBehaviorの
    # CachePolicyIdがCachingOptimizedのため、無効化しないと最大24時間反映が
    # 遅れる）
    FrontendDistributionId:
      Value: !Ref FrontendDistribution
    FrontendBucketName:
      Value: !Ref FrontendBucket
    RoutingKeyValueStoreArn:
      Value: !GetAtt RoutingKeyValueStore.Arn
